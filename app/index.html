<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribit Connect</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <!-- A record for the library: shared by every sleeve. The label takes --disc-label (amber while playing). -->
  <linearGradient id="minifill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d5ecab" stop-opacity=".22"/><stop offset="1" stop-color="#d5ecab" stop-opacity="0"/></linearGradient>
  <symbol id="disc" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="49.5" fill="#161617"/><circle cx="50" cy="50" r="48.8" fill="none" stroke="#ffffff38" stroke-width="1.2"/>
    <g fill="none" stroke="#ffffff12" stroke-width=".7"><circle cx="50" cy="50" r="44"/><circle cx="50" cy="50" r="38.5"/><circle cx="50" cy="50" r="33"/><circle cx="50" cy="50" r="27.5"/></g>
    <path d="M16 34A37 37 0 0 1 40 14" fill="none" stroke="#ffffff26" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="17" style="fill:var(--disc-label,#e6e0d1)"/>
    <circle cx="50" cy="50" r="12" fill="none" stroke="#0000001f" stroke-width=".8"/>
    <circle cx="50" cy="50" r="2.3" fill="#161617"/>
  </symbol>
</defs></svg>
<div class="app" id="app">
  <header class="top">
    <div class="plate-name"><span class="model">XSound Plus 2</span></div>
    <div class="mini-speaker" id="mini" aria-hidden="true"></div>
    <div class="instruments" id="instruments"></div>
    <button class="mech" id="deviceBtn" aria-expanded="false">Settings</button>
    <div class="winctl"><button data-win="minimize" aria-label="Minimize"><svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg></button><button data-win="maximize" aria-label="Maximize"><svg width="10" height="10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"/></svg></button><button data-win="close" class="close" aria-label="Close"><svg width="10" height="10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"/></svg></button></div>
  </header>

  <section class="stage" id="stage">
    <div class="rig" id="rig">
      <div class="units" id="units" role="group" aria-label="EQ button lights"></div>
      <div class="spkwrap"><div class="spk" id="spk"></div><div class="offline-card" id="offline" role="status" hidden></div></div>
      <svg class="conduits" id="conduits" aria-hidden="true"></svg>
    </div>
  </section>

  <section class="surface" id="surface">
    <div class="namebar">
      <input id="pname" aria-label="Profile name" maxlength="32">
      <div class="annunciators" id="ann" role="status"></div>
    </div>
    <div class="fplate" id="fplate">
      <div class="lcdcell"><div class="display" id="display"><svg id="dplot" aria-label="Equalizer curve" role="img"></svg></div></div>
      <div class="scale left" id="scaleL" aria-hidden="true"></div>
      <div class="channels" id="channels"></div>
      <div class="scale right" id="scaleR" aria-hidden="true"></div>
      <div class="groups" aria-hidden="true"><span style="--c:var(--low)">Low</span><span style="--c:var(--mid)">Mid</span><span style="--c:var(--high)">High</span></div>
      <div class="transport" id="transport"></div>
    </div>
  </section>

  <section class="library" id="library" aria-label="Your profiles" inert>
    <button class="lib-tab" data-library aria-label="Close the library"><svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M2 2l7 6 7-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="lib-head"><span class="engr">Yours</span><span class="count" id="libcount"></span><input id="libsearch" type="search" placeholder="Search" aria-label="Search profiles" autocomplete="off"></div>
    <div class="lib-body" id="libbody">
      <div class="crate front"><div class="crate-label"><span class="engr">On the bank</span></div><div class="crate-grid" id="libzone"></div></div>
      <div class="crate back"><div class="crate-label"><span class="engr">Library</span></div><div class="crate-grid" id="librest"></div></div>
      <p class="lib-empty" id="libempty" hidden>No profile matches.</p>
    </div>
  </section>

  <footer class="bank" id="bank">
    <span class="legend">PROGRAM</span>
    <div class="keys" id="keys"></div>
    <div class="lcdwrap"><div class="lcd" id="lcd"><span class="lstate" id="lstate"></span><svg id="lplot" aria-hidden="true"></svg></div>
      <button class="bigkey" id="editKey"><span class="ek edit">EDIT<small>sound</small></span><span class="ek done">DONE<small>listening</small></span></button></div>
  </footer>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Settings"></div>
<div class="ctx" id="ctx" hidden role="menu" aria-label="Profile"></div>
<script src="js/model.js"></script>
<script src="js/mock-backend.js"></script>
<script src="js/bridge.js"></script>
<script src="js/store.js"></script>
<script src="js/speaker.js"></script>
<script src="js/app.js"></script>
</body>
</html>
