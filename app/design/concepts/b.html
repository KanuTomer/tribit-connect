<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept B · Orbit</title>
<style>
@font-face{font-family:Inst;src:url(../../fonts/instrument-sans-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Inst;src:url(../../fonts/instrument-sans-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Serif;src:url(../../fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-style:italic}
@font-face{font-family:Serif;src:url(../../fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
:root{--putty:#d9d7cf;--putty-2:#cfccc2;--ink:#1b1b1d;--ink-2:#5d5a54;--ink-3:#8f8b82;--disc:#232326;--disc-2:#2c2c30;--groove:#38383d;
  --curve:#f2d64b;--low:#4a86ff;--mid:#3fbf73;--high:#ff7038;--wl:#f7f8fb;--bl:#3d8bff;--hot:#ff5b1f;--ease:cubic-bezier(.2,.75,.2,1)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;background:var(--putty);color:var(--ink);font:15px/1.35 Inst,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.app{position:relative;height:100vh;min-width:1040px;min-height:660px}
.corner{position:absolute;left:34px;top:26px;z-index:2}
.corner h1{font:italic 400 34px/1 Serif;letter-spacing:-.01em}
.corner p{color:var(--ink-2);font-size:13.5px;margin-top:6px;display:flex;gap:14px;align-items:center}
.corner .speaker{width:180px;color:var(--ink-2);margin-top:14px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:6px}.dot.on{background:var(--bl)}.dot.busy{background:#e8a317;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}
.topright{position:absolute;right:34px;top:30px;display:flex;gap:18px;z-index:2;font-size:14px}
.topright button{border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.stage{position:absolute;inset:0;display:grid;place-items:center}
#orbit{height:min(92vh,880px);width:min(92vh,880px);overflow:visible;transition:transform .6s var(--ease)}
.app.editing #orbit{transform:scale(1.04)}
.ring-lbl{font:600 13px Inst;letter-spacing:.04em;fill:var(--ink)}
.ring-sub{font:italic 22px Serif;fill:var(--ink)}
.seg{cursor:pointer;transition:stroke-width .25s var(--ease),opacity .25s}
.seg:hover,.seg.sel{stroke-width:30}
.seg.dropping{stroke-width:36}
.segbase{fill:none;stroke:var(--putty-2);stroke-width:22}
.tick{stroke:var(--groove);stroke-width:1}
.ring0{fill:none;stroke:#4a4a50;stroke-width:1;stroke-dasharray:2 5}
.spoke{stroke:#3a3a40;stroke-width:1}
.flabel{fill:#8f8f96;font:600 12px Inst;text-anchor:middle}
.curve{fill:#f2d64b22;stroke:var(--curve);stroke-width:3;stroke-linejoin:round}
.ghost{fill:none;stroke:#ffffff55;stroke-width:1.5;stroke-dasharray:4 6}
.h{cursor:grab}.h circle{stroke:var(--disc);stroke-width:3}.h text{fill:#fff;font:600 13px Inst;text-anchor:middle;opacity:0;transition:opacity .15s}
.h:hover text,.h.drag text,.h:focus text{opacity:1}
.hub{cursor:pointer}
.hub-name{font:italic 30px Serif;fill:#f3f1ea;text-anchor:middle}
.hub-sub{font:600 11.5px Inst;letter-spacing:.12em;fill:#9a9aa1;text-anchor:middle}
.tokens{position:absolute;top:0;bottom:0;width:230px;display:flex;flex-direction:column;justify-content:center;gap:12px;z-index:1;transition:opacity .4s,transform .5s var(--ease)}
.tokens.left{left:34px;align-items:flex-start}.tokens.right{right:34px;align-items:flex-end}
.app.editing .tokens{opacity:.35}
.tokens h2{font:600 12px Inst;letter-spacing:.14em;color:var(--ink-2);margin-bottom:4px}
.tok{display:flex;align-items:center;gap:12px;text-align:left;padding:3px;border-radius:40px;transition:transform .15s var(--ease)}
.tokens.right .tok{flex-direction:row-reverse;text-align:right}
.tok .disc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font:600 16px Inst;background:#efede6;box-shadow:0 2px 0 #0002,inset 0 -2px 0 #0001;flex:none;transition:box-shadow .25s,background .25s}
.tok.user .disc{background:var(--disc);color:#f3f1ea}
.tok .nm{font:italic 21px/1 Serif}
.tok .st{display:block;font:13px Inst;color:var(--ink-2);margin-top:3px}
.tok:hover{transform:translateX(4px)}.tokens.right .tok:hover{transform:translateX(-4px)}
.tok.playing .disc{box-shadow:0 0 0 3px var(--hot)}
.tok.editing .nm{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.tok.add .disc{background:none;border:1.5px dashed var(--ink-3);box-shadow:none;color:var(--ink-2)}
.app.choosing .tok:not(.add) .disc{animation:offer 1.1s ease-in-out infinite}
@keyframes offer{50%{box-shadow:0 0 0 4px #ff5b1f88}}
.bar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:22px;align-items:baseline;z-index:3;white-space:nowrap}
.bar .title{font:italic 30px Serif;border:0;background:none;color:var(--ink);width:260px;text-align:center;border-bottom:1.5px solid transparent}
.bar .title:focus{outline:0;border-bottom-color:var(--hot)}
.bar button{font-size:14.5px;border-bottom:1.5px solid var(--ink);padding-bottom:1px}
.bar button:disabled{opacity:.35;cursor:not-allowed}
.bar .go{background:var(--hot);color:#fff;border:0;border-radius:99px;padding:8px 16px}
.bar .note{font-size:13.5px;color:var(--ink-2)}
.prompt{position:absolute;left:50%;top:26px;transform:translateX(-50%);font-size:14px;color:var(--ink-2);z-index:2;text-align:center}
.prompt b{color:var(--hot);font-weight:600}
.sheet{position:fixed;right:30px;top:72px;width:320px;max-height:calc(100vh - 100px);overflow:auto;background:#efede6;border-radius:18px;padding:20px;z-index:9;box-shadow:0 20px 60px #0003}
.dv-head{display:flex;justify-content:space-between}.dv-head b{font:italic 26px Serif}.dv-close{font-size:13px;border-bottom:1px solid}
.dv-big{font:italic 60px/1 Serif;margin:8px 0}.dv-big small{font-size:24px}
.dv-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;color:var(--ink-2)}.dv-kv dd{text-align:right;color:var(--ink)}
.sheet h4{font:600 12px Inst;letter-spacing:.14em;color:var(--ink-2);margin:16px 0 2px}
.dv-sw{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14.5px;text-align:left}
.dv-sw i{width:36px;height:20px;border-radius:10px;background:var(--putty-2);position:relative;transition:background .2s}
.dv-sw i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}
.dv-sw[aria-checked=true] i{background:var(--ink)}.dv-sw[aria-checked=true] i::after{transform:translateX(16px)}
.dv-row{display:flex;gap:14px;margin-top:12px}.dv-row button{border-bottom:1.5px solid;font-size:14px}
.dv-note{font-size:12.5px;color:var(--ink-2);margin-top:14px}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#f3f1ea;padding:9px 18px;border-radius:99px;font-size:14px;z-index:10}
.toast button{color:var(--curve);margin-left:12px}
.mock-strip{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#000e;color:#aaa;font:11px Inst}
.mock-strip button{border:1px solid #555;padding:3px 8px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="corner"><h1>XSound Plus 2</h1><p id="status"></p><div id="spk"></div></div>
  <div class="topright"><button id="deviceBtn">Device</button></div>
  <p class="prompt" id="prompt"></p>
  <div class="tokens left" id="factory"></div>
  <div class="tokens right" id="user"></div>
  <div class="stage"><svg id="orbit" viewBox="-500 -500 1000 1000" role="img" aria-label="Sound orbit"></svg></div>
  <div class="bar" id="bar"></div>
</div>
<div class="sheet" id="sheet" hidden></div>
<script src="../../js/model.js"></script>
<script src="../../js/mock-backend.js"></script>
<script src="../../js/bridge.js"></script>
<script src="core.js"></script>
<script src="speaker.js"></script>
<script src="device.js"></script>
<script>
(function(){
const C=Core,M=C.M,B=M.BANDS,$=id=>document.getElementById(id),esc=C.esc;
const ui={mode:'listen',edit:null,draft:null,choosing:null,cur:null,anim:0};
// Polar geometry: 60 Hz at lower left sweeping clockwise over the top to 16 kHz at lower right, like a knob.
const R=300,HUB=96,LO=Math.log(60),HI=Math.log(16000);
const ang=x=>(135+x*270)*Math.PI/180;
const fa=f=>ang((Math.log(f)-LO)/(HI-LO));
const rad=db=>HUB+40+(db+9)/18*(R-HUB-52);
const pt=(a,r)=>[Math.cos(a)*r,Math.sin(a)*r];
const region=i=>i<3?'var(--low)':i<6?'var(--mid)':'var(--high)';
// The three lights sit on the outer ring across the top.
const SEG=[[-162,-122],[-110,-70],[-58,-18]].map(([a,b])=>[a*Math.PI/180,b*Math.PI/180]);
const arc=(r,a0,a1)=>{const[x0,y0]=pt(a0,r),[x1,y1]=pt(a1,r);return `M${x0} ${y0}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${x1} ${y1}`;};

const editing=()=>ui.edit?C.find(ui.edit):null;
const shown=()=>{if(ui.mode==='edit'){const p=editing();return {...p,factory:false,bands:ui.draft||(p.factory?C.bandsOf(p):p.bands),wasFactory:p.factory};}return C.find(C.active())||C.factory[1];};

function polar(v){return v.map((d,i)=>{const[x,y]=pt(ang(i/(v.length-1)),rad(d));return (i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}).join('')+`L${pt(ang(1),HUB+6).join(' ')}A${HUB+6} ${HUB+6} 0 1 0 ${pt(ang(0),HUB+6).join(' ')}Z`;}
function build(){
  const svg=$('orbit');let g='';
  // Disc and its calibration: rings at −8, 0 and +8 dB, ticks around the sweep.
  g+=`<circle r="${R+4}" fill="var(--disc)"/><circle r="${R-6}" fill="var(--disc-2)"/>`;
  for(const d of [-8,0,8])g+=`<circle r="${rad(d)}" class="ring0" ${d===0?'style="stroke:#6a6a72;stroke-dasharray:none"':''}/>`;
  for(let k=0;k<=54;k++){const a=ang(k/54),[x0,y0]=pt(a,R-6),[x1,y1]=pt(a,R-(k%6?14:22));g+=`<line class="tick" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" ${k%6?'':'style="stroke:#6a6a72"'}/>`;}
  B.freqs.forEach((f,i)=>{const a=fa(f),[x0,y0]=pt(a,HUB+20),[x1,y1]=pt(a,R-26),[lx,ly]=pt(a,R-40);
    g+=`<line class="spoke" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/><text class="flabel" x="${lx}" y="${ly+4}" style="fill:${region(i)}">${C.hz(f)}</text>`;});
  g+=`<path class="ghost" id="ghost"/><path class="curve" id="curve"/><g id="handles"></g>`;
  // Hub: the speaker's EQ button.
  g+=`<g class="hub" id="hub" tabindex="0" role="button"><circle r="${HUB}" fill="#18181a"/><circle r="${HUB-10}" fill="none" stroke-width="5" id="hubRing"/>
    <text class="hub-sub" y="-22" id="hubSub"></text><text class="hub-name" y="18" id="hubName"></text></g>`;
  // Outer ring: three lights.
  g+=`<g id="segs"></g>`;
  svg.innerHTML=g;
}
function drawCurve(v){$('curve').setAttribute('d',polar(v));}
function showCurve(animate=true){
  const target=C.curve(shown(),140);cancelAnimationFrame(ui.anim);
  if(!animate||!ui.cur||C.reduce()){ui.cur=target;drawCurve(target);return;}
  const from=ui.cur,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/520),e=1-Math.pow(1-k,4);ui.cur=from.map((a,i)=>a+(target[i]-a)*e);drawCurve(ui.cur);if(k<1)ui.anim=requestAnimationFrame(step);};ui.anim=requestAnimationFrame(step);
}
function segs(){
  const slots=C.slots(),lit=C.lit(),cols=['#55555b','var(--wl)','var(--bl)'];
  $('segs').innerHTML=slots.map((v,i)=>{const[a0,a1]=SEG[i],p=v.key?C.find(v.key):null,n=C.number(v.key);
    const busy=C.busy==='assign:'+i,mid=(a0+a1)/2,[tx,ty]=pt(mid,R+92);
    const status=busy?'writing…':v.status==='stale'?'edited · rewrite':lit===i?'playing':'';
    return `<path d="${arc(R+40,a0,a1)}" class="segbase"/>
      <path d="${arc(R+40,a0,a1)}" class="seg ${ui.choosing===i?'sel':''}" data-seg="${i}" stroke="${cols[i]}" stroke-width="22" fill="none" stroke-linecap="round" tabindex="0" role="button" aria-label="${Speaker.NAMES[i]}: ${esc(p?p.name:'')}" ${lit===i?`filter="url(#glow)"`:''}/>
      <text class="ring-lbl" x="${tx}" y="${ty-14}" text-anchor="middle">${Speaker.NAMES[i].toUpperCase()}${n?' · '+String(n).padStart(2,'0'):''}</text>
      <text class="ring-sub" x="${tx}" y="${ty+12}" text-anchor="middle">${esc(p?p.name:'—')}</text>
      <text class="ring-lbl" x="${tx}" y="${ty+32}" text-anchor="middle" style="fill:${v.status==='stale'?'var(--hot)':'var(--ink-2)'};font-weight:400">${status}</text>`;}).join('')+
    `<defs><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ff5b1f" flood-opacity=".55"/></filter></defs>`;
}
function hub(){
  const s=shown(),lit=C.lit(),cols=['#4a4a50','#f7f8fb','#3d8bff'];
  $('hubRing').setAttribute('stroke',ui.mode==='edit'?'var(--hot)':lit>=0?cols[lit]:'#4a4a50');
  $('hubSub').textContent=ui.mode==='edit'?'EDITING':C.linked()?'PLAYING':'NOT CONNECTED';
  const nm=ui.mode==='edit'?editing().name:s.name;$('hubName').textContent=nm.length>12?nm.slice(0,11)+'…':nm;
}
function handles(){
  const h=$('handles');if(ui.mode!=='edit'){h.innerHTML='';return;}
  const p=editing(),bands=ui.draft||(p.factory?C.bandsOf(p):p.bands);
  h.innerHTML=bands.map((b,i)=>{const[x,y]=pt(fa(B.freqs[i]),rad(b));const[tx,ty]=pt(fa(B.freqs[i]),rad(b)+30);
    return `<g class="h" data-band="${i}" tabindex="0" role="slider" aria-label="${C.hz(B.freqs[i])} hertz" aria-valuenow="${b}" style="${p.factory?'cursor:default':''}">
      <circle cx="${x}" cy="${y}" r="13" fill="${p.factory?'#77777d':region(i)}"/><text x="${tx}" y="${ty+5}">${b>0?'+'+b:b}</text></g>`;}).join('');
}
function tokens(){
  const active=C.active();
  const tok=(p,user)=>{const n=C.number(p.key),st=C.status(p);
    const note=active===p.key?'playing':user?({stale:'edited since applied',local:'on this PC',elsewhere:'applied earlier'}[st]||''):p.hint;
    return `<button class="tok ${user?'user':''} ${active===p.key?'playing':''} ${ui.edit===p.key&&ui.mode==='edit'?'editing':''}" data-key="${p.key}" draggable="true">
      <span class="disc">${String(n).padStart(2,'0')}</span><span><span class="nm">${esc(p.name)}</span><span class="st">${esc(note)}</span></span></button>`;};
  $('factory').innerHTML=`<h2>FACTORY</h2>`+C.factory.map(p=>tok(p,false)).join('');
  $('user').innerHTML=`<h2>YOURS</h2>`+C.custom().map(p=>tok(p,true)).join('')+`<button class="tok user add" data-new><span class="disc">+</span><span><span class="nm">New</span><span class="st">from what’s playing</span></span></button>`;
}
function status(){
  const s=C.speaker;const[cls,w]=s.status==='connecting'?['busy','connecting']:s.status==='updating'?['busy','writing']:s.connected?['on','connected']:['','not connected'];
  $('status').innerHTML=`<span><span class="dot ${cls}"></span>${w}</span><span>${s.battery>=0?s.battery+'% battery':''}</span>`;
  $('spk').innerHTML=Speaker.svg({light:C.lit(),style:'line',interactive:false});
  $('app').classList.toggle('choosing',ui.choosing!==null);
  $('prompt').innerHTML=ui.choosing!==null?`Choose a program for the <b>${Speaker.NAMES[ui.choosing].toLowerCase()}</b> — Esc cancels`:ui.mode==='edit'?'Drag the coloured points along their spokes · or type with arrow keys':'Tap a program to play it · drag it onto a light, or into the centre to edit';
}
function bar(){
  if(ui.mode!=='edit'){$('bar').innerHTML=`<button id="editBtn">Edit a sound</button>`;return;}
  const p=editing(),st=C.status(p),can=C.linked();
  const said=p.factory?'factory · read only':ui.draft?'unsaved':{applied:'saved · playing',stale:'saved · edited since applied',elsewhere:'saved · applied earlier',local:'saved on this PC'}[st];
  $('bar').innerHTML=`<input class="title" id="pname" value="${esc(p.name)}" ${p.factory?'readonly':''} aria-label="Profile name"><span class="note">${said}</span>
    ${p.factory?`<button data-do="dup">Duplicate to edit</button>`:`<button data-do="save" ${ui.draft?'':'disabled'}>Save</button><button data-do="dup">Duplicate</button><button data-do="flat">Flat</button><button data-do="del">Delete</button>`}
    <button class="go" data-do="apply" ${can?'':'disabled'}>${p.factory?'Play':'Apply'}</button><button data-do="done">Done</button>`;
}
function render(animate){if(!C.ready())return;status();tokens();segs();hub();handles();bar();showCurve(animate);
  const pl=C.find(C.active());$('ghost').setAttribute('d',ui.mode==='edit'&&pl&&pl.key!==ui.edit?polar(C.curve(pl,140)):'');
  if(!$('sheet').hidden)DeviceSheet.render($('sheet'));}
build();C.subscribe(()=>render(false));

function toast(text,action){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=esc(text)+(action?`<button>${esc(action.label)}</button>`:'');
  if(action)t.querySelector('button').onclick=()=>{action.run();t.remove();};document.body.append(t);setTimeout(()=>t.remove(),action?7000:3000);}
function edit(key){ui.mode='edit';ui.edit=key;ui.draft=null;ui.choosing=null;$('app').classList.add('editing');render(true);}
function setBand(i,v){const p=editing();if(p.factory)return;const b=(ui.draft||p.bands).slice();v=Math.max(-8,Math.min(8,Math.round(v)));if(b[i]===v)return;b[i]=v;ui.draft=M.sameBands(b,p.bands)?null:b;handles();bar();showCurve(false);}
async function assign(i,key){const p=C.find(key);const r=await C.assign(i,key);toast(r.ok?`${Speaker.NAMES[i]} now selects ${p.name}`:r.error);}
document.addEventListener('click',async e=>{
  const t=e.target;
  if(!$('sheet').hidden&&DeviceSheet.handle(e,()=>{$('sheet').hidden=true;}))return;
  if(t.closest('#deviceBtn')){$('sheet').hidden=!$('sheet').hidden;render(false);return;}
  if(t.closest('#editBtn')){const a=C.active();edit(a&&a!=='custom'?a:C.factory[1].key);return;}
  const seg=t.closest('[data-seg]');if(seg){const i=+seg.dataset.seg,v=C.slots()[i];if(v.status==='stale'){assign(i,v.key);return;}ui.choosing=ui.choosing===i?null:i;render(false);return;}
  if(t.closest('#hub')){if(ui.mode==='edit')return;const a=C.active();edit(a&&a!=='custom'?a:C.factory[1].key);return;}
  if(t.closest('[data-new]')){const a=C.find(C.active());const key=C.create({from:a&&!a.foreign?a.key:null});edit(key);setTimeout(()=>{$('pname').focus();$('pname').select();},50);return;}
  const k=t.closest('[data-key]');
  if(k){const key=k.dataset.key;
    if(ui.choosing!==null){const i=ui.choosing;ui.choosing=null;render(false);assign(i,key);return;}
    if(ui.mode==='edit'){if(ui.draft&&!confirm('Discard unsaved changes?'))return;edit(key);return;}
    const r=await C.apply(C.find(key));if(!r.ok)toast(r.error);else showCurve(true);return;}
  const d=t.closest('[data-do]')?.dataset.do;if(!d)return;const p=editing();
  if(d==='done'){if(ui.draft&&!confirm('Leave without saving?'))return;ui.mode='listen';ui.draft=null;$('app').classList.remove('editing');render(true);}
  else if(d==='save'){C.save(p.key,ui.draft);ui.draft=null;toast('Saved on this PC');render(false);}
  else if(d==='flat'){ui.draft=[0,0,0,0,0,0,0,0,0];if(M.sameBands(ui.draft,p.bands))ui.draft=null;render(true);}
  else if(d==='dup'){const key=C.create({from:p.key});if(ui.draft)C.save(key,ui.draft);edit(key);$('pname').focus();$('pname').select();}
  else if(d==='apply'){const r=await C.apply(p,ui.draft||undefined);toast(r.ok?`Playing ${p.name}`:r.error);}
  else if(d==='del'){const name=p.name,u=C.remove(p.key);edit(C.factory[1].key);toast(`Deleted ${name}`,{label:'Undo',run:()=>{C.undo(u);edit(u.profile.key);}});}
});
document.addEventListener('change',e=>{if(e.target.id==='pname'){const p=editing();if(p&&!p.factory)C.rename(p.key,e.target.value);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('sheet').hidden)$('sheet').hidden=true;else if(ui.choosing!==null){ui.choosing=null;render(false);}}
  if(e.target.id==='pname'&&e.key==='Enter')e.target.blur();
  if((e.key==='Enter'||e.key===' ')&&(e.target.dataset?.seg!=null||e.target.id==='hub')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
  const h=e.target.closest?.('.h');if(!h)return;const i=+h.dataset.band,b=(ui.draft||editing().bands)[i];
  const step={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key];if(step){e.preventDefault();setBand(i,b+step);$('handles').querySelector(`[data-band="${i}"]`)?.focus();}
});
// Handles move along their spoke: the distance from the centre is the gain.
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('.h');if(!h||editing().factory)return;const i=+h.dataset.band,svg=$('orbit');
  h.classList.add('drag');svg.setPointerCapture(e.pointerId);
  const mv=ev=>{const r=svg.getBoundingClientRect(),s=1000/r.width,x=(ev.clientX-r.left)*s-500,y=(ev.clientY-r.top)*s-500;
    const a=fa(B.freqs[i]),along=x*Math.cos(a)+y*Math.sin(a);setBand(i,(along-HUB-40)/(R-HUB-52)*18-9);};
  svg.onpointermove=mv;svg.onpointerup=()=>{svg.onpointermove=null;h.classList.remove('drag');};
});
// Drag a token onto a light, or into the centre to edit it.
document.addEventListener('dragstart',e=>{const k=e.target.closest('[data-key]');if(k)e.dataTransfer.setData('text/plain',k.dataset.key);});
document.addEventListener('dragover',e=>{const s=e.target.closest('[data-seg],#hub');if(s){e.preventDefault();s.classList.add('dropping');}});
document.addEventListener('dragleave',e=>{const s=e.target.closest('[data-seg],#hub');s&&s.classList.remove('dropping');});
document.addEventListener('drop',e=>{const s=e.target.closest('[data-seg],#hub');if(!s)return;e.preventDefault();s.classList.remove('dropping');const key=e.dataTransfer.getData('text/plain');
  if(s.id==='hub')edit(key);else assign(+s.dataset.seg,key);});
render(true);
if(location.hash==='#edit'){const go=()=>edit(C.custom()[0].key);if(C.ready())go();else{const off=C.subscribe(()=>{if(C.ready()){off();go();}});}}
})();
</script>
</body>
