<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept A · Control surface</title>
<style>
@font-face{font-family:Archivo;src:url(../../fonts/archivo-latin-wdth-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Doto;src:url(../../fonts/doto-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Seg;src:url(../../fonts/DSEG7Classic-Bold.woff2) format("woff2")}
:root{
  --ivory:#ece8de;--ivory-2:#e2ddd1;--ink:#1c1c1a;--ink-2:#5f5c55;--ink-3:#9a958a;--rule:#cbc5b8;
  --panel:#2a2a2c;--panel-2:#212123;--key:#f3f0e8;--key-user:#d9d3c5;--key-edge:#b5ae9f;
  --orange:#ff5a14;--amber:#ffb21a;--lcd:#22271e;--lcd-ink:#d5ecab;--lcd-dim:#58654a;
  --low:#2f6fe4;--mid:#2f9e5b;--high:#e4572e;--white-light:#f7f8fb;--blue-light:#3d8bff;
  --ease:cubic-bezier(.2,.75,.2,1);
}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ivory);color:var(--ink);font:14px/1.35 Archivo,system-ui,sans-serif;font-stretch:100%;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.app{height:100vh;min-width:1040px;min-height:660px;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:64px 1fr 172px;transition:grid-template-rows .5s var(--ease)}

/* header: a nameplate, not a toolbar */
.top{display:flex;align-items:center;gap:28px;padding:0 32px;border-bottom:1px solid var(--rule)}
.plate{display:flex;align-items:baseline;gap:14px}
.plate .model{font-weight:700;font-stretch:125%;font-size:21px;letter-spacing:-.01em}
.plate .sub{font-stretch:85%;color:var(--ink-2);font-size:13px}
.status{display:flex;align-items:center;gap:22px;margin-left:auto;font-size:13px;color:var(--ink-2)}
.status .link b{font-weight:600;color:var(--ink)}
.dotled{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink-3);margin-right:8px;vertical-align:0}
.dotled.on{background:var(--blue-light)}.dotled.busy{background:var(--amber);animation:blink 1s steps(2) infinite}.dotled.err{background:var(--orange)}
@keyframes blink{50%{opacity:.25}}
.gauge{display:inline-flex;align-items:center;gap:7px}
.gauge svg{display:block}
.mini-speaker{width:112px;view-transition-name:speaker;display:none}
.app.editing .mini-speaker{display:block}
.tiny{font-size:12.5px;font-weight:600;padding:7px 12px;border:1.5px solid var(--ink);border-radius:99px}
.tiny:hover{background:var(--ink);color:var(--ivory)}

/* stage: the speaker and what its button will do */
.stage{position:relative;display:grid;place-items:center;overflow:hidden}
.app.editing .stage{display:none}
.rig{position:relative;width:min(680px,58vw)}
.rig .speaker{width:100%;display:block;view-transition-name:speaker;filter:drop-shadow(0 18px 22px #00000026)}
.leads{position:absolute;inset:0;pointer-events:none;overflow:visible}
.leads path{fill:none;stroke:var(--ink);stroke-width:1}
.leads circle{fill:var(--ivory);stroke:var(--ink);stroke-width:1}
.tags{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:64px}
.tag{text-align:left;padding:2px 0 0;position:relative;border-top:2px solid var(--ink);min-width:0;display:flex;flex-direction:column;justify-content:flex-start;align-self:start}
.tag .what{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;font-stretch:115%;letter-spacing:.06em;text-transform:uppercase;padding-top:9px}
.tag .lamp{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#55565c;transition:box-shadow .4s,background .4s}
.tag[data-light="1"] .lamp{background:var(--white-light)}.tag[data-light="2"] .lamp{background:var(--blue-light)}
.tag.lit .lamp{box-shadow:0 0 0 4px #ffb21a55}
.tag .prog{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.tag .num{font:700 30px/1 Archivo;font-stretch:112%;letter-spacing:-.02em}
.tag .name{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .note{font-size:12px;color:var(--ink-2);margin-top:6px;min-height:16px}
.tag .note.stale{color:var(--orange)}
.tag:hover{border-top-color:var(--orange)}
.tag.choosing{border-top-color:var(--orange)}.tag.choosing .note{color:var(--orange)}
.tag.drop{background:#ff5a1414}
.hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ink-2)}

/* the program bank: the one dark instrument panel */
.bank{background:var(--panel);color:#d9d5cb;display:flex;align-items:center;gap:18px;padding:0 28px;position:relative;box-shadow:inset 0 1px 0 #ffffff12}
.bank .legend{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:600;letter-spacing:.2em;color:#8f8a7f;font-stretch:120%}
.keys{display:flex;gap:10px;align-items:flex-end;min-width:0}
.group{display:flex;flex-direction:column;gap:7px}
.group-label{font-size:10.5px;letter-spacing:.14em;font-weight:600;color:#8f8a7f;font-stretch:120%;display:flex;align-items:center;gap:8px}
.group-label::after{content:"";flex:1;height:1px;background:#4a4945}
.row{display:flex;gap:9px}
.userrow{overflow-x:auto;scrollbar-width:none;max-width:calc(100vw - 970px);min-width:170px}
@media (max-width:1240px){.lcd{display:none}.userrow{max-width:calc(100vw - 740px)}}
.pkey{width:78px;height:86px;border-radius:7px;background:var(--key);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:9px 9px 8px;position:relative;
  box-shadow:0 3px 0 var(--key-edge),0 6px 10px #0006;transition:transform .08s var(--ease),box-shadow .08s;flex:none}
.pkey.user{background:var(--key-user)}
.pkey .n{font:700 25px/1 Archivo;font-stretch:112%;letter-spacing:-.02em}
.pkey .t{font-size:11px;font-weight:500;line-height:1.15;text-align:left;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pkey:active,.pkey.down{transform:translateY(3px);box-shadow:0 0 0 var(--key-edge),0 2px 4px #0006}
.pkey .led{position:absolute;top:-11px;left:50%;width:14px;height:4px;margin-left:-7px;border-radius:2px;background:#4b4a46;transition:background .25s,box-shadow .25s}
.pkey.playing .led{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.pkey.editing{outline:2px solid var(--orange);outline-offset:3px}
.pkey.add{background:transparent;border:1.5px dashed #6d6a63;box-shadow:none;color:#bdb7aa;align-items:center;justify-content:center}
.pkey.add .n{font-weight:400}
.bank.choosing .pkey:not(.add){animation:offer 1.2s ease-in-out infinite}
@keyframes offer{50%{box-shadow:0 3px 0 var(--key-edge),0 0 0 3px var(--orange)}}
.lcdwrap{margin-left:auto;display:flex;align-items:center;gap:14px}
.lcd{width:220px;height:104px;background:var(--lcd);border-radius:6px;box-shadow:inset 0 2px 6px #000a,0 0 0 4px #1a1a1b;position:relative;overflow:hidden;view-transition-name:lcd;color:var(--lcd-ink)}
.lcd .lname{position:absolute;left:10px;top:7px;font:800 13px Doto;letter-spacing:.04em}
.lcd .lstate{position:absolute;right:10px;top:8px;font:800 10px Doto;color:var(--lcd-dim)}
.lcd svg{position:absolute;inset:0;width:100%;height:100%}
.app.editing .lcdwrap .lcd{visibility:hidden}
.bigkey{width:78px;height:86px;border-radius:7px;background:var(--orange);color:#fff;font-weight:700;font-stretch:120%;letter-spacing:.06em;font-size:13px;box-shadow:0 3px 0 #b33a06,0 6px 10px #0006;transition:transform .08s}
.bigkey:active{transform:translateY(3px);box-shadow:0 0 0 #b33a06}
.bigkey small{display:block;font-weight:500;letter-spacing:0;font-size:10.5px;opacity:.85;margin-top:3px}

/* edit mode: the control surface */
.surface{display:none;grid-template-columns:1fr 168px;grid-template-rows:auto 1fr auto;gap:0 34px;padding:22px 32px 18px;min-height:0}
.app.editing .surface{display:grid}
.app.editing{grid-template-rows:64px 1fr 172px}
.namebar{grid-column:1/3;display:flex;align-items:baseline;gap:18px;margin-bottom:14px}
.namebar input{font:700 30px Archivo;font-stretch:118%;letter-spacing:-.01em;border:0;background:none;color:var(--ink);border-bottom:2px solid transparent;padding:0 2px;width:auto;max-width:520px}
.namebar input:hover{border-bottom-color:var(--rule)}.namebar input:focus{outline:0;border-bottom-color:var(--orange)}
.namebar input[readonly]{border-bottom-color:transparent}
.namebar .said{font-size:14px;color:var(--ink-2)}.said b{font-weight:600;color:var(--ink)}.said .warn{color:var(--orange)}
.display{background:var(--lcd);border-radius:8px;box-shadow:inset 0 2px 10px #000b,0 0 0 5px var(--panel);position:relative;view-transition-name:lcd;min-height:150px;color:var(--lcd-ink);touch-action:none}
.display svg{position:absolute;inset:0;width:100%;height:100%}
.display .lname{position:absolute;left:14px;top:10px;font:800 14px Doto}
.grid line{stroke:#3a4431;stroke-width:1}.grid text{fill:var(--lcd-dim);font:800 10px Doto}
.curve{fill:none;stroke:var(--lcd-ink);stroke-width:2.2}
.curve-fill{fill:#d5ecab14}
.ghost{fill:none;stroke:var(--amber);stroke-width:1.3;stroke-dasharray:3 4;opacity:.8}
.faders{grid-column:1;display:grid;grid-template-columns:30px repeat(9,1fr);gap:0 6px;padding-top:18px;align-items:end}
.scale{position:relative;height:200px;align-self:start;margin-top:26px;font-size:11px;color:var(--ink-2);text-align:right}
.scale span{position:absolute;right:0;transform:translateY(-50%)}
.strip{display:flex;flex-direction:column;align-items:center;gap:8px}
.strip .val{font:14px Seg;color:var(--ink);height:18px}
.slot{position:relative;width:46px;height:200px;cursor:ns-resize;touch-action:none}
.slot::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:#2c2b29;border-radius:3px;box-shadow:inset 0 1px 2px #000}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,var(--ink-3) 0 1px,transparent 1px 12.5px);-webkit-mask:linear-gradient(90deg,#000 0 8px,transparent 8px 38px,#000 38px);mask:linear-gradient(90deg,#000 0 8px,transparent 8px 38px,#000 38px);opacity:.7}
.ticks::after{content:"";position:absolute;left:0;right:0;top:50%;height:1.5px;background:var(--ink)}
.cap{position:absolute;left:3px;width:40px;height:26px;margin-top:-13px;border-radius:5px;background:var(--c);box-shadow:0 3px 0 #0003,0 4px 8px #0004,inset 0 1px 0 #ffffff55;
  transition:top .45s var(--ease)}
.cap::after{content:"";position:absolute;left:6px;right:6px;top:50%;height:2px;margin-top:-1px;background:#ffffffd0;border-radius:1px}
.slot.drag .cap{transition:none}
.slot.locked{cursor:default}.slot.locked .cap{background:color-mix(in srgb,var(--c) 35%,#bdb7aa)}
.strip .hz{font-size:12px;font-weight:600;font-stretch:110%}
.strip .grp{width:100%;height:3px;background:var(--c);border-radius:2px}
.side{grid-row:2/4;grid-column:2;display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hkey{height:46px;border-radius:7px;background:var(--key);box-shadow:0 3px 0 var(--key-edge),0 5px 8px #0002;font-weight:600;font-stretch:110%;font-size:13px;text-align:left;padding:0 14px;transition:transform .08s}
.hkey:active{transform:translateY(3px);box-shadow:0 0 0 var(--key-edge)}
.hkey:disabled{opacity:.4;cursor:not-allowed}
.hkey.go{background:var(--orange);color:#fff;box-shadow:0 3px 0 #b33a06}
.hkey.done{margin-top:auto;background:var(--panel);color:var(--ivory);box-shadow:0 3px 0 #000}
.hkey.busy{animation:blink .5s steps(2) infinite}

/* device sheet */
.sheet{position:fixed;right:24px;top:72px;width:330px;max-height:calc(100vh - 96px);overflow:auto;background:var(--key);border:1.5px solid var(--ink);border-radius:10px;padding:18px;z-index:9;box-shadow:0 20px 50px #0003;animation:drop .3s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.dv-head{display:flex;justify-content:space-between;align-items:center}.dv-head b{font-stretch:120%;font-size:15px}
.dv-close{font-size:12px;color:var(--ink-2)}
.dv-big{font:44px Seg;margin:12px 0 4px}.dv-big small{font:600 16px Archivo;margin-left:4px}
.dv-kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;color:var(--ink-2)}.dv-kv dd{text-align:right;color:var(--ink)}
.sheet h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-stretch:120%;color:var(--ink-2);margin:16px 0 4px}
.dv-sw{width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px;text-align:left}
.dv-sw i{width:34px;height:18px;border-radius:3px;background:#bdb7aa;position:relative;transition:background .2s}
.dv-sw i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:2px;background:var(--key);box-shadow:0 1px 2px #0005;transition:transform .2s var(--ease)}
.dv-sw[aria-checked=true] i{background:var(--orange)}.dv-sw[aria-checked=true] i::after{transform:translateX(16px)}
.dv-row{display:flex;gap:8px;margin-top:14px}.dv-row button{flex:1;padding:9px;border:1.5px solid var(--ink);border-radius:99px;font-size:12.5px;font-weight:600}
.dv-note{font-size:12px;color:var(--ink-2);margin-top:14px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:190px;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:9px 16px;border-radius:99px;font-size:13px;z-index:10;animation:drop .25s var(--ease)}
.toast button{color:var(--amber);font-weight:600;margin-left:12px}
.mock-strip{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#000e;color:#aaa;font:11px Archivo}
.mock-strip button{border:1px solid #555;padding:3px 8px;border-radius:4px}
::view-transition-group(*){animation-duration:.5s;animation-timing-function:cubic-bezier(.2,.75,.2,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="plate"><span class="model">XSound Plus 2</span><span class="sub">Tribit Connect</span></div>
    <div class="status" id="status"></div>
    <div class="mini-speaker" id="mini"></div>
    <button class="tiny" id="deviceBtn">Device</button>
  </header>
  <section class="stage" id="stage">
    <div class="rig" id="rig"><div class="tags" id="tags"></div><div id="spk"></div><svg class="leads" id="leads"></svg></div>
    <p class="hint" id="hint"></p>
  </section>
  <section class="surface" id="surface">
    <div class="namebar"><input id="pname" aria-label="Profile name" maxlength="32"><span class="said" id="said"></span></div>
    <div class="display" id="display"><span class="lname" id="dname"></span><svg id="dplot"></svg></div>
    <div class="faders" id="faders"></div>
    <div class="side" id="side"></div>
  </section>
  <footer class="bank" id="bank">
    <span class="legend">PROGRAM</span>
    <div class="keys" id="keys"></div>
    <div class="lcdwrap"><div class="lcd" id="lcd"><span class="lname" id="lname"></span><span class="lstate" id="lstate"></span><svg id="lplot"></svg></div>
      <button class="bigkey" id="editKey">EDIT<small>sound</small></button></div>
  </footer>
</div>
<div class="sheet" id="sheet" hidden></div>
<script src="../../js/model.js"></script>
<script src="../../js/mock-backend.js"></script>
<script src="../../js/bridge.js"></script>
<script src="core.js"></script>
<script src="speaker.js"></script>
<script src="device.js"></script>
<script>
(function(){
const C=Core,M=C.M,$=id=>document.getElementById(id),esc=C.esc;
const B=M.BANDS,region=i=>i<3?'var(--low)':i<6?'var(--mid)':'var(--high)';
const ui={mode:'listen',choosing:null,edit:null,draft:null,toast:null};

// ---- curves on the two displays ---------------------------------------------------------------
function plotter(svg,{pad=[30,14,22,34],labels=true}={}){
  const P={svg,pad,cur:null,anim:0,w:0,h:0};
  P.layout=()=>{const r=svg.getBoundingClientRect();P.w=r.width;P.h=r.height;svg.setAttribute('viewBox',`0 0 ${P.w} ${P.h}`);
    const LO=Math.log(60),HI=Math.log(16000);P.X=x=>pad[3]+x*(P.w-pad[1]-pad[3]);P.FX=f=>P.X((Math.log(f)-LO)/(HI-LO));
    P.Y=d=>pad[0]+(1-(d+9)/18)*(P.h-pad[0]-pad[2]);P.DB=y=>Math.round(9-(y-pad[0])/(P.h-pad[0]-pad[2])*18);
    let g='';if(labels){for(const f of B.freqs)g+=`<line x1="${P.FX(f)}" x2="${P.FX(f)}" y1="${pad[0]}" y2="${P.h-pad[2]}"/><text x="${P.FX(f)}" y="${P.h-6}" text-anchor="middle">${C.hz(f)}</text>`;
      for(const d of [-8,-4,0,4,8])g+=`<line x1="${pad[3]}" x2="${P.w-pad[1]}" y1="${P.Y(d)}" y2="${P.Y(d)}" ${d===0?'style="stroke:#5d6b4c"':''}/><text x="6" y="${P.Y(d)+3}">${d>0?'+'+d:d}</text>`;}
    else g+=`<line x1="${pad[3]}" x2="${P.w-pad[1]}" y1="${P.Y(0)}" y2="${P.Y(0)}"/>`;
    svg.innerHTML=`<g class="grid">${g}</g><path class="curve-fill"/><path class="ghost"/><path class="curve"/>`;if(P.cur)P.draw(P.cur);};
  P.path=v=>v.map((d,i)=>(i?'L':'M')+P.X(i/(v.length-1)).toFixed(1)+' '+P.Y(d).toFixed(1)).join('');
  P.draw=v=>{if(!P.w)return;svg.querySelector('.curve').setAttribute('d',P.path(v));svg.querySelector('.curve-fill').setAttribute('d',P.path(v)+`L${P.X(1)} ${P.Y(-9)}L${P.X(0)} ${P.Y(-9)}Z`);};
  P.show=(target,animate=true)=>{cancelAnimationFrame(P.anim);if(!animate||!P.cur||C.reduce()){P.cur=target;P.draw(target);return;}
    const from=P.cur,t0=performance.now();const step=t=>{const k=Math.min(1,(t-t0)/480),e=1-Math.pow(1-k,4);P.cur=from.map((a,i)=>a+(target[i]-a)*e);P.draw(P.cur);if(k<1)P.anim=requestAnimationFrame(step);};P.anim=requestAnimationFrame(step);};
  P.ghost=v=>{const g=svg.querySelector('.ghost');g&&g.setAttribute('d',v?P.path(v):'');};
  new ResizeObserver(()=>P.layout()).observe(svg);
  return P;
}
const lplot=plotter($('lplot'),{pad:[26,8,8,8],labels:false}),dplot=plotter($('dplot'),{pad:[34,18,24,40]});

// ---- what is shown --------------------------------------------------------------------------------
const playing=()=>C.find(C.active());
const editing=()=>ui.edit?C.find(ui.edit):null;
const shownBands=()=>{const p=editing();if(!p)return null;return ui.draft||(p.factory?C.bandsOf(p):p.bands);};

function status(){
  const s=C.speaker;if(!s)return;
  const [cls,word]=s.status==='connecting'?['busy','Connecting']:s.status==='updating'?['busy','Writing']:s.connected?['on','Connected']:s.status==='unavailable'?['err','Bluetooth off']:['','Not connected'];
  const cells=Math.max(0,Math.round(s.battery/20));
  $('status').innerHTML=`<span class="link"><span class="dotled ${cls}"></span><b>${word}</b></span>
    <span class="gauge" title="Battery"><svg width="30" height="14" viewBox="0 0 30 14"><rect x=".75" y=".75" width="25.5" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="27" y="4.5" width="2.5" height="5" rx="1" fill="currentColor"/>
    ${[0,1,2,3,4].map(i=>`<rect x="${3+i*4.6}" y="3.3" width="3.6" height="7.4" rx=".6" fill="${i<cells?(s.battery<=20?'var(--orange)':'currentColor'):'#0001'}"/>`).join('')}</svg>${s.battery>=0?s.battery+'%':''}</span>`;
}
function speaker(){
  const s=C.speaker,state=!s?'off':s.status==='connecting'?'connecting':s.connected?'linked':'off';
  $('spk').innerHTML=Speaker.svg({light:C.lit(),state,id:'big'});
  $('mini').innerHTML=Speaker.svg({light:C.lit(),state,id:'mini',interactive:false});
}
function tags(){
  const slots=C.slots(),lit=C.lit();
  $('tags').innerHTML=slots.map((v,i)=>{
    const p=v.key?C.find(v.key):null,n=v.key?C.number(v.key):null;
    const busy=C.busy==='assign:'+i,choosing=ui.choosing===i;
    const note=choosing?'Pick a program on the bank — Esc to cancel':busy?'Writing to the speaker…':v.status==='stale'?'Profile changed since — press to rewrite':v.status==='changed'?'Changed by another app':lit===i?'Playing now':'';
    return `<button class="tag ${lit===i?'lit':''} ${choosing?'choosing':''}" data-light="${i}" data-tag="${i}" aria-pressed="${choosing}">
      <span class="what"><span class="lamp"></span>${Speaker.NAMES[i]}</span>
      <span class="prog"><span class="num">${n?String(n).padStart(2,'0'):'··'}</span><span class="name">${esc(p?p.name:'Not read yet')}</span></span>
      <span class="note ${v.status==='stale'?'stale':''}">${note}</span></button>`;}).join('');
  requestAnimationFrame(leads);
  $('hint').textContent=ui.choosing!==null?'':'Press a program to play it. Choose a light above to change what the speaker’s EQ button selects.';
}
// Leader lines from each label to the EQ button on the drawing, like a callout in a manual.
function leads(){
  const rig=$('rig'),eq=rig.querySelector('.spk-eq circle.spk-ring');if(!eq)return;
  const R=rig.getBoundingClientRect(),E=eq.getBoundingClientRect(),ex=E.left+E.width/2-R.left,ey=E.top-R.top+2;
  let d='';rig.querySelectorAll('.tag').forEach((t,i)=>{const r=t.getBoundingClientRect(),x=r.left-R.left+22,y=r.bottom-R.top+8;
    const midY=y+(ey-y)*.55;d+=`<path d="M${x} ${y}V${midY}L${ex+(i-1)*7} ${ey-14}L${ex} ${ey}"/><circle cx="${x}" cy="${y}" r="3"/>`;});
  $('leads').innerHTML=d;
}
function keys(){
  const active=C.active(),choosing=ui.choosing!==null;
  const key=(p,user)=>{const n=C.number(p.key);return `<button class="pkey ${user?'user':''} ${active===p.key?'playing':''} ${ui.edit===p.key?'editing':''}" data-key="${p.key}" draggable="true"
    title="${esc(p.name)}${active===p.key?' — playing':''}"><span class="led"></span><span class="n">${String(n).padStart(2,'0')}</span><span class="t">${esc(p.name)}</span></button>`;};
  $('keys').innerHTML=`<div class="group"><span class="group-label">FACTORY</span><div class="row">${C.factory.map(p=>key(p,false)).join('')}</div></div>
    <div class="group"><span class="group-label">YOURS</span><div class="row userrow">${C.custom().map(p=>key(p,true)).join('')}<button class="pkey add" data-new title="New profile"><span class="n">+</span><span class="t">new</span></button></div></div>`;
  $('bank').classList.toggle('choosing',choosing);
  const p=ui.mode==='edit'?editing():playing();
  $('lname').textContent=p?p.name.toUpperCase():'—';
  $('lstate').textContent=C.linked()?(ui.mode==='edit'?'EDITING':'PLAYING'):'OFFLINE';
  lplot.show(p?C.curve(p,120):Array(120).fill(0));
  $('editKey').innerHTML=ui.mode==='edit'?'DONE<small>back to listening</small>':'EDIT<small>sound</small>';
}
// ---- edit surface ------------------------------------------------------------------------------
function surface(animate){
  const p=editing();if(!p)return;
  const bands=shownBands(),locked=p.factory,st=C.status(p);
  $('pname').value=p.name;$('pname').readOnly=locked;$('dname').textContent=(locked?'FACTORY ':'')+C.number(p.key).toString().padStart(2,'0');
  const where={applied:'<b>Playing on the speaker</b>',stale:'<span class="warn">Applied earlier — edited since</span>',elsewhere:'Applied earlier, not playing',local:'Only on this PC',factory:'Stored on the speaker'}[st]||'';
  $('said').innerHTML=locked?'Factory program — read only. Duplicate it to make your own.':`${ui.draft?'<span class="warn">Unsaved changes</span> · ':`Saved · r${p.rev} · `}${where}`;
  dplot.show(C.curve({...p,factory:false,bands},160),animate);
  const pl=playing();dplot.ghost(pl&&pl.key!==p.key?C.curve(pl,160):null);
  if(!$('faders').children.length){
    $('faders').innerHTML=`<div class="scale">${[8,4,0,-4,-8].map(v=>`<span style="top:${(8-v)/16*100}%">${v>0?"+"+v:v<0?"−"+(-v):0}</span>`).join("")}</div>`+B.freqs.map((f,i)=>`<div class="strip" style="--c:${region(i)}">
      <span class="val" id="v${i}"></span><div class="slot" data-band="${i}" tabindex="0" role="slider" aria-label="${C.hz(f)} hertz" aria-valuemin="-8" aria-valuemax="8"><div class="ticks"></div><div class="cap"></div></div>
      <span class="hz">${C.hz(f)}</span><span class="grp"></span></div>`).join('');
  }
  bands.forEach((b,i)=>{const slot=$('faders').querySelector(`[data-band="${i}"]`);slot.classList.toggle('locked',locked);slot.setAttribute('aria-valuenow',b);slot.setAttribute('aria-disabled',locked);
    slot.querySelector('.cap').style.top=((8-b)/16*100)+'%';$('v'+i).textContent=(locked?'':'')+(b>0?'+'+b:b);});
  const busy=C.busy==='apply',can=C.linked();
  $('side').innerHTML=locked?`<button class="hkey" data-do="dup">Duplicate to edit</button><button class="hkey go ${busy?'busy':''}" data-do="apply" ${can?'':'disabled'}>Play it</button>`:
    `<button class="hkey" data-do="save" ${ui.draft?'':'disabled'}>Save</button><button class="hkey" data-do="revert" ${ui.draft?'':'disabled'}>Revert</button>
     <button class="hkey" data-do="dup">Duplicate</button><button class="hkey" data-do="flat">Reset to flat</button>
     <button class="hkey go ${busy?'busy':''}" data-do="apply" ${can?'':'disabled'} title="${can?'Play this curve on the speaker':'Connect the speaker first'}">Apply to speaker</button>
     <button class="hkey" data-do="del">Delete</button>`;
}
function render(animate){
  if(!C.ready())return;
  status();speaker();keys();
  if(ui.mode==='listen')tags();else surface(animate);
  if(!$('sheet').hidden)DeviceSheet.render($('sheet'));
}
C.subscribe(()=>render(false));

// ---- actions --------------------------------------------------------------------------------------
function toast(text,action){ui.toast&&ui.toast.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=esc(text)+(action?`<button>${esc(action.label)}</button>`:'');
  if(action)t.querySelector('button').onclick=()=>{action.run();t.remove();};document.body.append(t);ui.toast=t;setTimeout(()=>t.remove(),action?7000:3200);}
async function play(p){const r=await C.apply(p);if(!r.ok)toast(r.error);}
function enterEdit(key){
  const p=key?C.find(key):playing();const target=p&&!p.foreign?p:C.factory[1];
  C.transition(()=>{ui.mode='edit';ui.edit=target.key;ui.draft=null;ui.choosing=null;$('app').classList.add('editing');render(false);dplot.layout();surface(false);});
}
function leaveEdit(){
  if(ui.draft&&!confirm('Leave without saving your changes?'))return;
  C.transition(()=>{ui.mode='listen';ui.draft=null;$('app').classList.remove('editing');render(false);});
}
function setBand(i,v){
  const p=editing();if(!p||p.factory)return;
  const b=(ui.draft||p.bands).slice();v=Math.max(-8,Math.min(8,Math.round(v)));if(b[i]===v)return;b[i]=v;
  ui.draft=M.sameBands(b,p.bands)?null:b;surface(false);
}
document.addEventListener('click',async e=>{
  const t=e.target;
  if(!$('sheet').hidden&&DeviceSheet.handle(e,()=>{$('sheet').hidden=true;}))return;
  if(t.closest('#deviceBtn')){$('sheet').hidden=!$('sheet').hidden;render(false);return;}
  if(t.closest('#editKey')){ui.mode==='edit'?leaveEdit():enterEdit();return;}
  const tag=t.closest('[data-tag]');
  if(tag){const i=+tag.dataset.tag,v=C.slots()[i];
    if(v.status==='stale'){const r=await C.assign(i,v.key);if(!r.ok)toast(r.error);return;}
    ui.choosing=ui.choosing===i?null:i;render(false);return;}
  if(t.closest('[data-new]')){const from=ui.mode==='edit'?editing():playing();const key=C.create({from:from&&!from.foreign?from.key:null});
    if(ui.mode==='edit'){ui.edit=key;ui.draft=null;render(true);$('pname').focus();$('pname').select();}else{enterEdit(key);setTimeout(()=>{$('pname').focus();$('pname').select();},500);}return;}
  const k=t.closest('[data-key]');
  if(k){k.classList.add('down');setTimeout(()=>k.classList.remove('down'),120);
    const p=C.find(k.dataset.key);
    if(ui.choosing!==null){const i=ui.choosing;ui.choosing=null;render(false);const r=await C.assign(i,p.key);toast(r.ok?`${Speaker.NAMES[i]} now selects ${p.name}`:r.error);return;}
    if(ui.mode==='edit'){if(ui.draft&&!confirm('Discard unsaved changes?'))return;ui.edit=p.key;ui.draft=null;render(true);return;}
    play(p);return;}
  const d=t.closest('[data-do]')?.dataset.do;if(!d)return;
  const p=editing();
  if(d==='save'){C.save(p.key,ui.draft);ui.draft=null;toast(`Saved ${p.name} on this PC`);render(false);}
  else if(d==='revert'){ui.draft=null;surface(true);}
  else if(d==='flat'){ui.draft=M.sameBands(p.bands,[0,0,0,0,0,0,0,0,0])?null:[0,0,0,0,0,0,0,0,0];surface(true);}
  else if(d==='dup'){const key=C.create({from:p.key});if(ui.draft)C.save(key,ui.draft);ui.edit=key;ui.draft=null;render(true);$('pname').focus();$('pname').select();}
  else if(d==='apply'){const r=await C.apply(p,ui.draft||undefined);toast(r.ok?(ui.draft?`Playing your unsaved edit of ${p.name}`:`Playing ${p.name}`):r.error);}
  else if(d==='del'){const name=p.name,undo=C.remove(p.key);ui.edit=C.factory[1].key;ui.draft=null;render(true);toast(`Deleted ${name}`,{label:'Undo',run:()=>{C.undo(undo);ui.edit=undo.profile.key;render(true);}});}
});
$('pname').addEventListener('change',e=>{const p=editing();if(p&&!p.factory)C.rename(p.key,e.target.value);});
$('pname').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('sheet').hidden){$('sheet').hidden=true;return;}if(ui.choosing!==null){ui.choosing=null;render(false);return;}}
  if((e.ctrlKey||e.metaKey)&&e.key==='s'&&ui.draft){e.preventDefault();document.querySelector('[data-do=save]')?.click();}
  const s=e.target.closest?.('.slot');if(!s)return;const i=+s.dataset.band,b=shownBands()[i];
  const step={ArrowUp:1,ArrowDown:-1,PageUp:4,PageDown:-4,Home:8,End:-8}[e.key];if(step!=null){e.preventDefault();setBand(i,e.key==='Home'||e.key==='End'?step:b+step);}
  if(e.key==='0')setBand(i,0);
});
// Faders follow the pointer; the display can be drawn on directly.
document.addEventListener('pointerdown',e=>{
  const s=e.target.closest('.slot');
  if(s&&!s.classList.contains('locked')){const i=+s.dataset.band,r=s.getBoundingClientRect();s.setPointerCapture(e.pointerId);s.classList.add('drag');
    const mv=ev=>setBand(i,8-(ev.clientY-r.top)/r.height*16);mv(e);s.onpointermove=mv;s.onpointerup=s.onpointercancel=()=>{s.onpointermove=null;s.classList.remove('drag');};return;}
  const disp=e.target.closest('#display');
  if(disp&&editing()&&!editing().factory){const r=$('dplot').getBoundingClientRect();disp.setPointerCapture(e.pointerId);
    const mv=ev=>{const x=ev.clientX-r.left;let best=0;B.freqs.forEach((f,i)=>{if(Math.abs(dplot.FX(f)-x)<Math.abs(dplot.FX(B.freqs[best])-x))best=i;});setBand(best,dplot.DB(ev.clientY-r.top));};
    mv(e);disp.onpointermove=mv;disp.onpointerup=()=>{disp.onpointermove=null;};}
});
dblclickReset();function dblclickReset(){document.addEventListener('dblclick',e=>{const s=e.target.closest('.slot');if(s)setBand(+s.dataset.band,0);});}
// Drag a program key onto a light.
document.addEventListener('dragstart',e=>{const k=e.target.closest('[data-key]');if(k)e.dataTransfer.setData('text/plain',k.dataset.key);});
document.addEventListener('dragover',e=>{const t=e.target.closest('[data-tag]');if(t){e.preventDefault();t.classList.add('drop');}});
document.addEventListener('dragleave',e=>{const t=e.target.closest('[data-tag]');if(t&&!t.contains(e.relatedTarget))t.classList.remove('drop');});
document.addEventListener('drop',async e=>{const t=e.target.closest('[data-tag]');if(!t)return;e.preventDefault();t.classList.remove('drop');
  const i=+t.dataset.tag,p=C.find(e.dataTransfer.getData('text/plain'));if(!p)return;const r=await C.assign(i,p.key);toast(r.ok?`${Speaker.NAMES[i]} now selects ${p.name}`:r.error);});
addEventListener('resize',()=>ui.mode==='listen'&&leads());
render(true);
// #edit opens the editor on the first saved profile (for screenshots and reviews).
if(location.hash==='#edit'){const go=()=>{ui.mode='edit';ui.edit=C.custom()[0].key;$('app').classList.add('editing');render(false);dplot.layout();surface(false);};
  if(C.ready())go();else{const off=C.subscribe(()=>{if(C.ready()){off();go();}});}}
})();
</script>
</body>
</html>
