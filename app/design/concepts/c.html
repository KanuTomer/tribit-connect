<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept C · Bench unit</title>
<style>
@font-face{font-family:Cond;src:url(../../fonts/barlow-condensed-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Cond;src:url(../../fonts/barlow-condensed-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Seg;src:url(../../fonts/DSEG7Classic-Bold.woff2) format("woff2")}
@font-face{font-family:Seg14;src:url(../../fonts/DSEG14Classic-Regular.woff2) format("woff2")}
:root{--enamel:#d6d1c4;--enamel-2:#cbc5b6;--engrave:#2b2a26;--engrave-2:#6a665c;--light-edge:#ece8de;--paper:#f3efe3;--grid:#d9c9b0;--ink:#1f2a44;
  --window:#170d0a;--led:#ff3d1f;--led-dim:#3a1a12;--knob:#262523;--low:#2f6fe4;--mid:#2f9e5b;--high:#e4572e;--lamp-w:#fbfaf4;--lamp-b:#3d8bff;--amber:#f2a516;--ease:cubic-bezier(.2,.75,.2,1)}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
html,body{height:100%;background:#9c978b;color:var(--engrave);font:500 15px/1.3 Cond,'Arial Narrow',sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.unit{height:100vh;min-width:1040px;min-height:660px;background:var(--enamel);display:grid;grid-template-rows:76px 1fr auto 196px;
  background-image:radial-gradient(#0000000a 1px,transparent 1px);background-size:3px 3px}
.sec{position:relative;border-bottom:1px solid #0000002e;box-shadow:0 1px 0 var(--light-edge)}
.lbl{font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--engrave)}
.lbl.sm{font-size:10.5px;letter-spacing:.16em;color:var(--engrave-2)}
/* nameplate */
.plate{display:flex;align-items:center;gap:26px;padding:0 30px}
.badge{font-weight:600;font-size:13px;letter-spacing:.34em;border:1.5px solid var(--engrave);padding:4px 8px 3px 11px}
.model{font-weight:600;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.model small{font-size:13px;letter-spacing:.18em;color:var(--engrave-2);margin-left:12px}
.meter{margin-left:auto;display:flex;align-items:center;gap:12px}
.meter svg{display:block}
.lampbulb{width:16px;height:16px;border-radius:50%;background:#7b766b;box-shadow:inset 0 2px 3px #0005;transition:background .3s,box-shadow .3s}
.lampbulb.on{background:radial-gradient(circle at 40% 35%,#fff6c8,var(--amber) 60%);box-shadow:0 0 10px var(--amber)}
.lampbulb.busy{animation:blink .7s steps(2) infinite;background:var(--amber)}
@keyframes blink{50%{opacity:.25}}
.pbtn{height:34px;padding:0 14px;background:linear-gradient(#efebe1,#d9d3c5);border:1px solid #8d887c;border-radius:3px;box-shadow:0 2px 0 #8d887c;font-weight:600;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.pbtn:active,.pbtn.down{transform:translateY(2px);box-shadow:none}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn.red{background:linear-gradient(#e2553a,#c23b22);color:#fff;border-color:#8a2412;box-shadow:0 2px 0 #8a2412}
.pbtn.armed{animation:armed .8s steps(2) infinite}
@keyframes armed{50%{background:var(--amber)}}
/* main: chart recorder + program selector */
.main{display:grid;grid-template-columns:1fr 330px;gap:0;min-height:0;overflow:hidden}
.recorder{padding:20px 26px 18px 30px;display:flex;flex-direction:column;gap:8px;min-height:0;border-right:1px solid #0000002e;box-shadow:1px 0 0 var(--light-edge)}
.rec-head{display:flex;justify-content:space-between;align-items:baseline}
.rec-head .title{font-weight:600;font-size:21px;letter-spacing:.04em}
.window{flex:1;min-height:150px;background:#2a2824;border-radius:4px;padding:8px;box-shadow:inset 0 2px 6px #000a,0 1px 0 var(--light-edge)}
.paper{position:relative;width:100%;height:100%;background:var(--paper);border-radius:2px;overflow:hidden;touch-action:none}
.paper svg{position:absolute;inset:0;width:100%;height:100%}
.g1{stroke:var(--grid);stroke-width:.6}.g2{stroke:#c8a983;stroke-width:1}.gt{fill:#9c7a55;font:500 11px Cond}
.trace{fill:none;stroke:var(--ink);stroke-width:2}
.trace.drawing{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:pen 1.1s var(--ease) forwards}
@keyframes pen{to{stroke-dashoffset:0}}
.ref{fill:none;stroke:#c23b22;stroke-width:1.2;stroke-dasharray:5 4;opacity:.75}
.pen{stroke:#c23b22;stroke-width:1.5}
.selector{padding:18px 26px;display:grid;grid-template-rows:auto 1fr auto;gap:10px;justify-items:center}
.knobwrap{position:relative;width:270px;height:250px}
.knobwrap svg{width:100%;height:100%;overflow:visible}
.kpos{cursor:pointer}.kpos text{font:600 15px Cond;fill:var(--engrave);text-anchor:middle}
.kpos:hover text{fill:#c23b22}
.kpos .nm{font:500 11px Cond;letter-spacing:.06em;fill:var(--engrave-2)}
#knob{transition:transform .5s var(--ease);transform-origin:0 0}
.mem{display:flex;align-items:center;gap:10px;width:100%;justify-content:center}
.seg{background:var(--window);color:var(--led);font:22px Seg;padding:6px 10px 5px;border-radius:3px;box-shadow:inset 0 2px 4px #000;letter-spacing:.04em;position:relative}
.seg .off{position:absolute;inset:6px 10px 5px;color:var(--led-dim);z-index:0}.seg .on{position:relative;z-index:1;text-shadow:0 0 6px #ff3d1f99}
.memname{font-weight:600;font-size:17px;letter-spacing:.04em;min-width:120px}
.arrow{width:30px;height:30px;font-size:13px;padding:0}
/* calibration drawer */
.drawer{display:grid;grid-template-columns:1fr 210px;gap:0 24px;padding:0 30px;max-height:0;overflow:hidden;transition:max-height .55s var(--ease),padding .55s var(--ease);background:var(--enamel-2)}
.unit.cal .drawer{max-height:340px;padding:16px 30px 18px}
.pots{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.pot{display:flex;flex-direction:column;align-items:center;gap:6px}
.pot .seg{font-size:15px;padding:4px 6px 3px}
.track{position:relative;width:44px;height:170px;cursor:ns-resize;touch-action:none}
.track::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:4px;margin-left:-2px;background:#1a1917;border-radius:2px}
.track .eng{position:absolute;inset:6px 0;background:repeating-linear-gradient(to bottom,var(--engrave) 0 1px,transparent 1px 9.875px);-webkit-mask:linear-gradient(90deg,#000 0 9px,transparent 9px 35px,#000 35px);mask:linear-gradient(90deg,#000 0 9px,transparent 9px 35px,#000 35px)}
.handle{position:absolute;left:8px;width:28px;height:34px;margin-top:-17px;background:linear-gradient(#3b3936,#1d1c1a);border-radius:3px;box-shadow:0 3px 4px #0006;transition:top .5s var(--ease)}
.handle::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:3px;margin-top:-1.5px;background:var(--c)}
.track.drag .handle{transition:none}
.track.locked{cursor:default}.track.locked .handle{opacity:.55}
.pot .hz{font-weight:600;font-size:14px;letter-spacing:.06em}
.pot .band{width:70%;height:3px;background:var(--c)}
.calkeys{display:flex;flex-direction:column;gap:8px;justify-content:center}
.calkeys .pbtn{width:100%}
.calname{font:600 19px Cond;letter-spacing:.04em;background:var(--paper);border:1px solid #8d887c;padding:5px 8px;width:100%;color:var(--engrave)}
.calnote{font-size:13px;color:var(--engrave-2);line-height:1.3}
/* EQ button assignment */
.assign{display:grid;grid-template-columns:330px 1fr auto;gap:30px;align-items:center;padding:14px 30px}
.drawing{color:var(--engrave);position:relative}
.drawing .speaker{width:100%;display:block}
.callout{position:absolute;font:600 12px Cond;letter-spacing:.1em}
.lamps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.lampbtn{display:flex;flex-direction:column;align-items:stretch;gap:8px;text-align:left}
.lampface{height:62px;border-radius:4px;border:1px solid #6a665c;box-shadow:0 3px 0 #6a665c,inset 0 -6px 12px #0003;display:grid;place-items:center;font-weight:600;letter-spacing:.2em;font-size:13px;transition:box-shadow .3s,filter .3s,transform .08s}
.lampbtn[data-light="0"] .lampface{background:linear-gradient(#5b5953,#3d3c38);color:#cfcabd}
.lampbtn[data-light="1"] .lampface{background:linear-gradient(#fffef8,#e5e3da);color:#3d3c38}
.lampbtn[data-light="2"] .lampface{background:linear-gradient(#78aeff,#2f6fe4);color:#fff}
.lampbtn.lit .lampface{box-shadow:0 3px 0 #6a665c,0 0 18px 2px #fff7;filter:brightness(1.12)}
.lampbtn[data-light="2"].lit .lampface{box-shadow:0 3px 0 #6a665c,0 0 18px 2px #3d8bffaa}
.lampbtn[data-light="0"].lit .lampface{box-shadow:0 3px 0 #6a665c,0 0 0 3px var(--amber)}
.lampbtn:active .lampface{transform:translateY(3px);box-shadow:none}
.strip{background:var(--paper);border:1px solid #a49c88;padding:5px 9px 4px;font:600 16px Cond;letter-spacing:.03em;transform:rotate(-.4deg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip small{display:block;font-weight:500;font-size:11.5px;letter-spacing:.14em;color:#8b8371;text-transform:uppercase}
.strip.stale small{color:#c23b22}
.unit.storing .lampface{animation:offer 1s ease-in-out infinite}
@keyframes offer{50%{box-shadow:0 3px 0 #6a665c,0 0 0 3px var(--amber)}}
.store{display:flex;flex-direction:column;gap:8px;align-items:stretch;width:150px}
.store p{font-size:12.5px;color:var(--engrave-2);line-height:1.3}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle svg{display:block}
.toggle .lever{transition:transform .25s var(--ease);transform-origin:13px 30px}
.unit.cal .toggle .lever{transform:rotate(36deg)}
.sheet{position:fixed;right:28px;top:84px;width:320px;max-height:calc(100vh - 110px);overflow:auto;background:var(--paper);border:1.5px solid var(--engrave);padding:16px 18px;z-index:9;box-shadow:6px 6px 0 #0002}
.dv-head{display:flex;justify-content:space-between}.dv-head b{font-weight:600;letter-spacing:.16em;text-transform:uppercase}.dv-close{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.dv-big{font:40px Seg;color:var(--led);background:var(--window);padding:8px 10px;margin:10px 0;display:inline-block}.dv-big small{font:600 16px Cond;margin-left:4px}
.dv-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px}.dv-kv dd{text-align:right}
.sheet h4{font-weight:600;font-size:11.5px;letter-spacing:.18em;color:var(--engrave-2);margin:14px 0 3px}
.dv-sw{width:100%;display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dotted #a49c88;font-size:15px;text-align:left}
.dv-sw i{width:12px;height:12px;border-radius:50%;background:#7b766b;box-shadow:inset 0 2px 3px #0005}.dv-sw[aria-checked=true] i{background:var(--led);box-shadow:0 0 6px var(--led)}
.dv-row{display:flex;gap:8px;margin-top:12px}.dv-row button{flex:1;border:1px solid var(--engrave);padding:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.dv-note{font-size:13px;color:var(--engrave-2);margin-top:12px}
.toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:var(--window);color:var(--led);font:16px Seg14;padding:8px 14px;z-index:10;letter-spacing:.06em;white-space:nowrap}
.toast button{font:600 12px Cond;color:var(--amber);letter-spacing:.14em;margin-left:12px}
.mock-strip{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#000e;color:#aaa;font:12px Cond}
.mock-strip button{border:1px solid #555;padding:3px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="unit" id="unit">
  <header class="sec plate">
    <span class="badge">TRIBIT</span><span class="model">XSound Plus 2<small>Equalisation unit · Type TC-2</small></span>
    <div class="meter" id="meter"></div>
    <button class="pbtn" id="deviceBtn">Settings</button>
  </header>
  <section class="sec main">
    <div class="recorder">
      <div class="rec-head"><span class="title" id="title"></span><span class="lbl sm" id="recnote"></span></div>
      <div class="window"><div class="paper" id="paper"><svg id="chart"></svg></div></div>
    </div>
    <div class="selector">
      <span class="lbl">Program</span>
      <div class="knobwrap"><svg id="selector" viewBox="-135 -125 270 250"></svg></div>
      <div class="mem"><span class="lbl sm">Mem</span><button class="pbtn arrow" data-mem="-1" aria-label="Previous memory">▲</button>
        <span class="seg" id="memseg"></span><button class="pbtn arrow" data-mem="1" aria-label="Next memory">▼</button><span class="memname" id="memname"></span></div>
    </div>
  </section>
  <section class="sec drawer" id="drawer">
    <div class="pots" id="pots"></div>
    <div class="calkeys" id="calkeys"></div>
  </section>
  <section class="sec assign">
    <div class="drawing" id="drawing"></div>
    <div><div class="lbl" style="margin-bottom:10px">EQ button · press cycles off → white → blue</div><div class="lamps" id="lamps"></div></div>
    <div class="store">
      <button class="toggle" id="calToggle" aria-pressed="false"><svg width="26" height="44" viewBox="0 0 26 44"><rect x="3" y="24" width="20" height="16" rx="2" fill="#9a958a" stroke="#4e4a42"/><g class="lever"><rect x="10.5" y="4" width="5" height="26" rx="2.5" fill="#d8d5cd" stroke="#4e4a42"/></g><circle cx="13" cy="30" r="5" fill="#3b3936"/></svg>
        <span><span class="lbl">Calibrate</span><br><span class="lbl sm">edit curves</span></span></button>
      <button class="pbtn" id="storeBtn">Store → light</button>
      <p id="storeNote">Select a program, press STORE, then a light.</p>
    </div>
  </section>
</div>
<div class="sheet" id="sheet" hidden></div>
<script src="../../js/model.js"></script>
<script src="../../js/mock-backend.js"></script>
<script src="../../js/bridge.js"></script>
<script src="core.js"></script>
<script src="speaker.js"></script>
<script src="device.js"></script>
<script>
(function(){
const C=Core,M=C.M,B=M.BANDS,$=id=>document.getElementById(id),esc=C.esc;
const ui={sel:null,mem:0,cal:false,draft:null,storing:false};
const region=i=>i<3?'var(--low)':i<6?'var(--mid)':'var(--high)';
const seg=(text,width)=>`<span class="off">${'8'.repeat(width)}</span><span class="on">${text.padStart(width,'!')}</span>`;
const current=()=>C.find(ui.sel)||C.factory[1];
const bandsNow=()=>{const p=current();return ui.draft||(p.factory?C.bandsOf(p):p.bands);};

// ---- chart recorder ---------------------------------------------------------------------------
const chart={w:0,h:0};
const LO=Math.log(50),HI=Math.log(20000);
function layout(){const r=$('chart').getBoundingClientRect();chart.w=r.width;chart.h=r.height;}
const X=f=>36+(Math.log(f)-LO)/(HI-LO)*(chart.w-50),Y=d=>16+(1-(d+10)/20)*(chart.h-38),DB=y=>Math.round(10-(y-16)/(chart.h-38)*20);
function drawChart(animate){
  layout();if(!chart.w)return;const p=current();let g='';
  for(const f of [50,60,70,80,90,100,200,300,400,500,600,700,800,900,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000,20000])g+=`<line class="${[100,1000,10000].includes(f)?'g2':'g1'}" x1="${X(f)}" x2="${X(f)}" y1="16" y2="${chart.h-22}"/>`;
  for(let d=-10;d<=10;d+=2)g+=`<line class="${d===0?'g2':'g1'}" x1="36" x2="${chart.w-14}" y1="${Y(d)}" y2="${Y(d)}"/>`+(d%5===0||d===0?'':'');
  for(const d of [-10,-5,0,5,10])g+=`<text class="gt" x="6" y="${Y(d)+4}">${d>0?'+'+d:d}</text>`;
  for(const f of [100,1000,10000,50,500,5000])g+=`<text class="gt" x="${X(f)-6}" y="${chart.h-6}">${C.hz(f)}</text>`;
  const v=C.curve({...p,factory:p.factory&&!ui.draft,bands:bandsNow()},180),LOg=Math.log(60),HIg=Math.log(16000);
  const path=v.map((d,i)=>{const f=Math.exp(LOg+(HIg-LOg)*i/(v.length-1));return (i?'L':'M')+X(f).toFixed(1)+' '+Y(d).toFixed(1);}).join('');
  const pl=C.find(C.active());let ref='';
  if(pl&&pl.key!==p.key){const rv=C.curve(pl,180);ref=`<path class="ref" d="${rv.map((d,i)=>{const f=Math.exp(LOg+(HIg-LOg)*i/(rv.length-1));return (i?'L':'M')+X(f).toFixed(1)+' '+Y(d).toFixed(1);}).join('')}"/>`;}
  const marks=ui.cal&&!p.factory?bandsNow().map((b,i)=>`<circle cx="${X(B.freqs[i])}" cy="${Y(b)}" r="4" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5"/>`).join(''):'';
  $('chart').setAttribute('viewBox',`0 0 ${chart.w} ${chart.h}`);
  $('chart').innerHTML=`<g>${g}</g>${ref}<path class="trace" id="trace" d="${path}"/>${marks}`;
  if(animate&&!C.reduce()){const t=$('trace'),len=t.getTotalLength();t.style.setProperty('--len',len);t.classList.add('drawing');}
}
// ---- program selector: a detented rotary switch -----------------------------------------------
const POS=[...C.factory.map(p=>p.key),'mem'];
const posAngle=i=>-150+i*50;
function selector(){
  const p=current(),idx=p.factory?POS.indexOf(p.key):6,svg=$('selector');let g='';
  POS.forEach((k,i)=>{const a=posAngle(i)*Math.PI/180,x=Math.sin(a)*104,y=-Math.cos(a)*104,tx=Math.sin(a)*86,ty=-Math.cos(a)*86;
    const f=C.find(k);g+=`<g class="kpos" data-pos="${i}" role="button" tabindex="0" aria-label="${k==='mem'?'Memories':esc(f.name)}"><line x1="${tx*.86}" y1="${ty*.86}" x2="${tx*.98}" y2="${ty*.98}" stroke="var(--engrave)" stroke-width="2"/>
      <text x="${x}" y="${y+4}">${k==='mem'?'MEM':String(i+1).padStart(2,'0')}</text>${k!=='mem'?`<text class="nm" x="${x}" y="${y+17}">${esc(f.name.toUpperCase())}</text>`:''}</g>`;});
  g+=`<circle r="62" fill="#b9b3a4"/><g id="knob" style="transform:rotate(${posAngle(idx)}deg)"><circle r="56" fill="var(--knob)"/>
    ${Array.from({length:24},(_,k)=>{const a=k*15*Math.PI/180;return `<line x1="${Math.sin(a)*50}" y1="${-Math.cos(a)*50}" x2="${Math.sin(a)*56}" y2="${-Math.cos(a)*56}" stroke="#3d3b37" stroke-width="3"/>`;}).join('')}
    <circle r="40" fill="#302e2b"/><rect x="-2.5" y="-54" width="5" height="26" rx="2" fill="#f1ede3"/></g>`;
  svg.innerHTML=g;
  const users=C.custom(),m=users[ui.mem];
  $('memseg').innerHTML=seg(m?String(C.number(m.key)).padStart(2,'0'):'--',2);
  $('memname').textContent=m?m.name.toUpperCase():'EMPTY';
}
// ---- calibration drawer ----------------------------------------------------------------------
function pots(){
  const p=current(),bands=bandsNow(),locked=p.factory;
  if(!$('pots').children.length)$('pots').innerHTML=B.freqs.map((f,i)=>`<div class="pot" style="--c:${region(i)}"><span class="seg" id="ps${i}"></span>
    <div class="track" data-band="${i}" tabindex="0" role="slider" aria-label="${C.hz(f)} hertz" aria-valuemin="-8" aria-valuemax="8"><div class="eng"></div><div class="handle"></div></div>
    <span class="hz">${C.hz(f)}</span><span class="band"></span></div>`).join('');
  bands.forEach((b,i)=>{const t=$('pots').querySelector(`[data-band="${i}"]`);t.classList.toggle('locked',locked);t.setAttribute('aria-valuenow',b);
    t.querySelector('.handle').style.top=`calc(6px + ${(8-b)/16} * (100% - 12px))`;$('ps'+i).innerHTML=seg(b<0?'-'+(-b):String(b),2);});
  const can=C.linked(),st=C.status(p);
  $('calkeys').innerHTML=locked?`<p class="calnote">Factory program — fixed in the speaker. Copy it to a memory to calibrate your own.</p><button class="pbtn" data-do="dup">Copy to new mem</button>`:
    `<input class="calname" id="pname" value="${esc(p.name)}" maxlength="32" aria-label="Memory name">
     <p class="calnote">${ui.draft?'Changes not stored':`Stored · rev ${p.rev}`} · ${{applied:'on the speaker',stale:'speaker has an older version',elsewhere:'sent earlier',local:'not sent to the speaker'}[st]}</p>
     <button class="pbtn" data-do="save" ${ui.draft?'':'disabled'}>Store to mem</button><button class="pbtn" data-do="flat">Clear (flat)</button>
     <button class="pbtn red" data-do="apply" ${can?'':'disabled'}>Transmit</button>`;
}
// ---- EQ button lamps ---------------------------------------------------------------------------
function lamps(){
  const slots=C.slots(),lit=C.lit();
  $('lamps').innerHTML=slots.map((v,i)=>{const p=v.key?C.find(v.key):null,n=v.key?C.number(v.key):null,busy=C.busy==='assign:'+i;
    return `<button class="lampbtn ${lit===i?'lit':''}" data-light="${i}" data-lamp="${i}" aria-label="${Speaker.NAMES[i]}: ${esc(p?p.name:'')}">
      <span class="lampface">${['OFF','WHITE','BLUE'][i]}</span>
      <span class="strip ${v.status==='stale'?'stale':''}"><small>${busy?'transmitting…':v.status==='stale'?'mem changed · store again':lit===i?'playing':'light '+['off','white','blue'][i]}</small>${n?String(n).padStart(2,'0')+'  ':''}${esc(p?p.name:'—')}</span></button>`;}).join('');
  $('drawing').innerHTML=Speaker.svg({light:lit,style:'line',interactive:false})+`<span class="callout" style="left:${424/640*100}%;top:-6px;transform:translateX(-50%)">EQ ↓</span>`;
}
function meter(){
  const s=C.speaker,v=Math.max(0,Math.min(100,s.battery||0)),a=(-60+v*1.2)*Math.PI/180;
  const lampCls=s.status==='connecting'||s.status==='updating'?'busy':s.connected?'on':'';
  $('meter').innerHTML=`<div style="text-align:center"><svg width="120" height="56" viewBox="-60 -50 120 56"><rect x="-58" y="-48" width="116" height="52" rx="3" fill="#f3efe3" stroke="#6a665c"/>
    <path d="M-40 -6A46 46 0 0 1 40 -6" fill="none" stroke="#1f2a44" stroke-width="1"/><path d="M-36 -15A40 40 0 0 1 -26 -27" fill="none" stroke="#c23b22" stroke-width="3"/>
    ${[0,25,50,75,100].map(t=>{const b=(-60+t*1.2)*Math.PI/180;return `<line x1="${Math.sin(b)*40}" y1="${-Math.cos(b)*40+28-28}" x2="${Math.sin(b)*46}" y2="${-Math.cos(b)*46}" stroke="#1f2a44" transform="translate(0,${0})"/>`;}).join('')}
    <line x1="0" y1="0" x2="${Math.sin(a)*44}" y2="${-Math.cos(a)*44}" stroke="#c23b22" stroke-width="1.6" style="transition:all .6s"/><circle r="3.5" fill="#1f2a44"/>
    <text x="-50" y="-36" font-size="8" font-family="Cond" fill="#6a665c" letter-spacing="1">BATTERY %</text></svg></div>
    <div><span class="lbl sm">Link</span><div class="lampbulb ${lampCls}" style="margin:5px auto 0"></div></div>`;
}
function render(animate){
  if(!C.ready())return;
  if(!ui.sel){const a=C.active();ui.sel=a&&a!=='custom'?a:C.factory[1].key;const u=C.custom().findIndex(p=>p.key===ui.sel);if(u>=0)ui.mem=u;}
  const p=current();
  $('title').textContent=(p.factory?'Program ':'Memory ')+String(C.number(p.key)).padStart(2,'0')+' — '+p.name;
  $('recnote').textContent=ui.cal?'calibrating · draw on the paper':C.active()===p.key?'response · playing':'response · red dashes: playing now';
  meter();selector();lamps();if(ui.cal)pots();drawChart(animate);
  $('unit').classList.toggle('cal',ui.cal);$('unit').classList.toggle('storing',ui.storing);$('storeBtn').classList.toggle('armed',ui.storing);
  $('storeNote').textContent=ui.storing?`Press a light to store ${p.name} on it.`:'Select a program, press STORE, then a light.';
  if(!$('sheet').hidden)DeviceSheet.render($('sheet'));
}
C.subscribe(()=>render(false));
new ResizeObserver(()=>drawChart(false)).observe($('paper'));

function toast(text,action){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.innerHTML=esc(text.toUpperCase())+(action?`<button>${esc(action.label)}</button>`:'');
  if(action)t.querySelector('button').onclick=()=>{action.run();t.remove();};document.body.append(t);setTimeout(()=>t.remove(),action?7000:3000);}
// Selecting a program plays it, unless calibrating (then it only loads).
async function select(key,play=true){
  if(ui.draft&&!confirm('Discard changes that are not stored?'))return;
  ui.sel=key;ui.draft=null;render(true);
  if(play&&!ui.cal){const r=await C.apply(current());if(!r.ok)toast(r.error);}
}
function setBand(i,v){const p=current();if(p.factory)return;const b=(ui.draft||p.bands).slice();v=Math.max(-8,Math.min(8,Math.round(v)));if(b[i]===v)return;b[i]=v;ui.draft=M.sameBands(b,p.bands)?null:b;pots();drawChart(false);}
document.addEventListener('click',async e=>{
  const t=e.target;
  if(!$('sheet').hidden&&DeviceSheet.handle(e,()=>{$('sheet').hidden=true;}))return;
  if(t.closest('#deviceBtn')){$('sheet').hidden=!$('sheet').hidden;render(false);return;}
  const pos=t.closest('[data-pos]');if(pos){const k=POS[+pos.dataset.pos];if(k==='mem'){const m=C.custom()[ui.mem];if(m)select(m.key);}else select(k);return;}
  const mem=t.closest('[data-mem]');if(mem){const n=C.custom().length;if(!n)return;ui.mem=(ui.mem+ +mem.dataset.mem+n)%n;select(C.custom()[ui.mem].key);return;}
  if(t.closest('#calToggle')){if(ui.cal&&ui.draft&&!confirm('Leave calibration without storing?'))return;ui.cal=!ui.cal;ui.draft=null;$('calToggle').setAttribute('aria-pressed',ui.cal);render(true);return;}
  if(t.closest('#storeBtn')){ui.storing=!ui.storing;render(false);return;}
  const lamp=t.closest('[data-lamp]');
  if(lamp){const i=+lamp.dataset.lamp,v=C.slots()[i];
    if(ui.storing){ui.storing=false;const p=current();render(false);const r=await C.assign(i,p.key);toast(r.ok?`${Speaker.SHORT[i]} light: ${p.name}`:r.error);return;}
    if(v.status==='stale'){const r=await C.assign(i,v.key);toast(r.ok?'stored again':r.error);return;}
    if(v.key&&v.key!=='custom'){ui.sel=v.key;ui.draft=null;const u=C.custom().findIndex(p=>p.key===v.key);if(u>=0)ui.mem=u;render(true);}return;}
  const d=t.closest('[data-do]')?.dataset.do;if(!d)return;const p=current();
  if(d==='save'){C.save(p.key,ui.draft);ui.draft=null;toast('stored to mem '+C.number(p.key));render(false);}
  else if(d==='flat'){ui.draft=M.sameBands(p.bands,[0,0,0,0,0,0,0,0,0])?null:[0,0,0,0,0,0,0,0,0];pots();drawChart(true);}
  else if(d==='dup'){const key=C.create({from:p.key});ui.sel=key;ui.mem=C.custom().length-1;ui.draft=null;render(true);$('pname')?.select();}
  else if(d==='apply'){const r=await C.apply(p,ui.draft||undefined);toast(r.ok?'transmitted':r.error);}
});
document.addEventListener('change',e=>{if(e.target.id==='pname'){C.rename(current().key,e.target.value);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('sheet').hidden)$('sheet').hidden=true;else if(ui.storing){ui.storing=false;render(false);}}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset?.pos!=null){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}
  const tr=e.target.closest?.('.track');if(!tr)return;const i=+tr.dataset.band,b=bandsNow()[i];const s={ArrowUp:1,ArrowDown:-1}[e.key];if(s){e.preventDefault();setBand(i,b+s);}
});
document.addEventListener('pointerdown',e=>{
  const tr=e.target.closest('.track');
  if(tr&&!tr.classList.contains('locked')){const i=+tr.dataset.band,r=tr.getBoundingClientRect();tr.setPointerCapture(e.pointerId);tr.classList.add('drag');
    const mv=ev=>setBand(i,8-(ev.clientY-r.top-6)/(r.height-12)*16);mv(e);tr.onpointermove=mv;tr.onpointerup=()=>{tr.onpointermove=null;tr.classList.remove('drag');};return;}
  const paper=e.target.closest('#paper');
  if(paper&&ui.cal&&!current().factory){const r=paper.getBoundingClientRect();paper.setPointerCapture(e.pointerId);
    const mv=ev=>{const x=ev.clientX-r.left;let best=0;B.freqs.forEach((f,i)=>{if(Math.abs(X(f)-x)<Math.abs(X(B.freqs[best])-x))best=i;});setBand(best,DB(ev.clientY-r.top));};
    mv(e);paper.onpointermove=mv;paper.onpointerup=()=>{paper.onpointermove=null;};}
});
render(true);
if(location.hash==='#edit'){const go=()=>{ui.sel=C.custom()[0].key;ui.mem=0;ui.cal=true;render(false);};if(C.ready())go();else{const off=C.subscribe(()=>{if(C.ready()){off();go();}});}}
})();
</script>
</body>
</html>
