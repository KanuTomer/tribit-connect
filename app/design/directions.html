<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Lab directions</title>
<style>
@font-face{font-family:Martian;src:url(../fonts/martian-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Martian;src:url(../fonts/martian-mono-latin-600-normal.woff2) format("woff2");font-weight:600}
@font-face{font-family:Doto;src:url(../fonts/doto-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Doto;src:url(../fonts/doto-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:Plex;src:url(../fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:Plex;src:url(../fonts/ibm-plex-mono-latin-500-normal.woff2) format("woff2");font-weight:500}
@font-face{font-family:Serif;src:url(../fonts/instrument-serif-latin-400-italic.woff2) format("woff2");font-style:italic}
@font-face{font-family:Serif;src:url(../fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{background:#111;color:#ddd;font:13px Martian,monospace}
.picker{display:flex;gap:2px;padding:10px 16px;align-items:center;background:#0b0b0b;border-bottom:1px solid #222;position:sticky;top:0;z-index:5}
.picker b{font-weight:400;color:#777;margin-right:12px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.picker button{font:inherit;font-size:11px;background:#1c1c1c;color:#aaa;border:1px solid #2a2a2a;padding:6px 12px;cursor:pointer}
.picker button[aria-pressed=true]{background:#e9e4d8;color:#111}
.picker .note{margin-left:auto;color:#666;font-size:10px}
.stage{display:grid;place-items:center;padding:24px;min-height:calc(100vh - 44px);overflow:auto}
.dir{width:1180px;height:740px;position:relative;user-select:none}
.dir:not(.on){display:none!important}
svg{display:block}
.pt{cursor:ns-resize}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── A · Bench instrument ───────────────────────────────────────────── */
.A{background:#1a1b1d;border-radius:14px;box-shadow:inset 0 1px 0 #2c2d30,0 30px 80px #000a;font-family:Martian;color:#cfcac0;padding:18px;display:grid;
  grid-template:"head head head" 44px "keys disp patch" 1fr "keys bands patch" 92px / 236px 1fr 212px;gap:14px}
.A .head{grid-area:head;display:flex;align-items:center;gap:22px;padding:0 6px;font-size:11px;letter-spacing:.06em;color:#8d8a83}
.A .head .name{color:#e9e4d8;font-size:15px;font-weight:600;letter-spacing:.02em}
.A .led{width:7px;height:7px;border-radius:50%;background:#3ad6c1;box-shadow:0 0 8px #3ad6c1;display:inline-block;margin-right:8px;vertical-align:1px}
.A .batt{display:inline-flex;gap:2px;vertical-align:-1px;margin-right:8px}.A .batt i{width:5px;height:10px;background:#e9e4d8}.A .batt i.off{background:#3a3a3d}
.A .head .win{margin-left:auto;display:flex;gap:16px;color:#6d6a64}
.A .keys{grid-area:keys;display:flex;flex-direction:column;gap:10px}
.A .lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#77746d;padding:2px 2px 0}
.A .pad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.A .key{height:62px;border-radius:9px;background:linear-gradient(#e7e3da,#d5d0c5);color:#2b2a27;border:0;box-shadow:0 2px 0 #9d988d,0 4px 10px #0007;font:600 10.5px Martian;
  text-align:left;padding:9px 10px;position:relative;cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.35}
.A .key small{display:block;font-weight:400;color:#7c786f;font-size:9px;margin-top:2px}
.A .key:active,.A .key.sel{transform:translateY(2px);box-shadow:0 0 0 #9d988d,0 2px 6px #0007}
.A .key.sel::after{content:"";position:absolute;right:9px;top:9px;width:7px;height:7px;border-radius:50%;background:#ffcf1a;box-shadow:0 0 10px #ffcf1a}
.A .custom{flex:1;background:#141517;border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:3px;box-shadow:inset 0 1px 3px #000}
.A .row{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:6px;font-size:11px;cursor:pointer;color:#bdb8ad}
.A .row:hover{background:#1f2023}.A .row.sel{background:#24363a;color:#e9fffb}
.A .row .tag{margin-left:auto;font-size:9px;color:#6e6b65}
.A .row .new{color:#3ad6c1}
.A .disp{grid-area:disp;background:#0a0e0e;border-radius:10px;box-shadow:inset 0 0 0 1px #233,inset 0 10px 40px #000;position:relative;overflow:hidden}
.A .disp .grid line{stroke:#17302f;stroke-width:1}.A .disp .grid text{fill:#3c6b66;font:9px Martian}
.A .disp .fill{fill:url(#aFill)}.A .disp .curve{fill:none;stroke:#3ad6c1;stroke-width:2.2;filter:url(#aGlow)}
.A .disp .ghost{fill:none;stroke:#3ad6c155;stroke-width:1;stroke-dasharray:3 4}
.A .disp .pt circle{fill:#0a0e0e;stroke:#3ad6c1;stroke-width:2}.A .disp .pt:hover circle,.A .disp .pt.drag circle{fill:#3ad6c1}
.A .disp .pt text{fill:#bff7ef;font:9px Martian;text-anchor:middle;opacity:0;transition:opacity .15s}.A .disp .pt:hover text,.A .disp .pt.drag text{opacity:1}
.A .disp .title{position:absolute;left:16px;top:12px;font-size:10px;letter-spacing:.12em;color:#4e8e86;text-transform:uppercase}
.A .disp .title b{color:#bff7ef;font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:none;margin-left:8px}
.A .disp .state{position:absolute;right:16px;top:12px;font-size:10px;color:#4e8e86}
.A .bands{grid-area:bands;display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.A .band{background:#141517;border-radius:7px;padding:8px 6px;text-align:center;box-shadow:inset 0 1px 3px #000}
.A .band .db{font:600 15px Martian;color:#e9e4d8}.A .band .hz{font-size:9px;color:#6e6b65;margin-top:6px}
.A .band .knob{width:22px;height:22px;border-radius:50%;margin:6px auto 0;background:conic-gradient(from 225deg,#3ad6c1 0 var(--a),#2a2b2e var(--a) 270deg,transparent 270deg);
  -webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.A .patch{grid-area:patch;background:#141517;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 3px #000}
.A .slot{border-radius:9px;padding:12px;background:#1d1e21;cursor:pointer;display:grid;grid-template-columns:38px 1fr;gap:4px 10px;align-items:center;border:1px solid transparent}
.A .slot.sel{border-color:#ffcf1a55;background:#232320}
.A .lamp{grid-row:span 2;width:38px;height:38px;border-radius:50%;border:2px solid #34353a;background:#0d0d0f;position:relative}
.A .lamp.white{background:radial-gradient(#fff,#cfd6e0 55%,#0d0d0f 72%);box-shadow:0 0 18px #ffffff66}
.A .lamp.blue{background:radial-gradient(#9fd0ff,#2f7bff 55%,#0d0d0f 72%);box-shadow:0 0 18px #2f7bff88}
.A .slot .sn{font-size:9px;letter-spacing:.14em;color:#77746d;text-transform:uppercase}
.A .slot .pn{font-size:12px;font-weight:600;color:#e9e4d8}
.A .sync{font-size:9px;letter-spacing:.06em;grid-column:2}.A .sync.ok{color:#3ad6c1}.A .sync.stale{color:#ffcf1a}
.A .press{margin-top:auto;font-size:10px;color:#6e6b65;line-height:1.6}
.A .press b{color:#ffcf1a;font-weight:400}
.A .apply{margin-top:8px;height:40px;border-radius:8px;border:0;background:#ffcf1a;color:#1a1b1d;font:600 11px Martian;letter-spacing:.06em;cursor:pointer}

/* ── B · Field display ──────────────────────────────────────────────── */
.B{background:#d8d6d0;border-radius:22px;padding:26px;box-shadow:inset 0 2px 0 #fff8,inset 0 -3px 0 #0002,0 30px 80px #0009;display:grid;
  grid-template-columns:96px 1fr 96px;grid-template-rows:1fr 88px;gap:18px;font-family:Doto;color:#f2f2f2}
.B .side{display:flex;flex-direction:column;gap:12px;justify-content:center}
.B .soft{height:64px;border-radius:12px;background:#ecebe7;box-shadow:0 3px 0 #a9a69e;border:0;font:500 11px Martian;color:#3a3936;cursor:pointer;display:grid;place-items:center;text-transform:lowercase}
.B .soft:active,.B .soft.sel{transform:translateY(3px);box-shadow:none}
.B .soft .c{width:10px;height:10px;border-radius:50%;display:block;margin:0 auto 4px}
.B .screen{background:#050505;border-radius:10px;box-shadow:inset 0 0 0 6px #1b1b1b,inset 0 0 0 7px #000;padding:22px 26px;position:relative;overflow:hidden}
.B .top{display:flex;justify-content:space-between;font:800 15px Doto;letter-spacing:.06em}
.B .top .dim{color:#5b5b5b}
.B .big{font:800 54px Doto;letter-spacing:.02em;margin-top:8px;color:#fff;line-height:1}
.B .big small{font-size:18px;color:#ff6a1a;margin-left:14px;vertical-align:10px}
.B .plot{position:absolute;left:26px;right:26px;top:118px;height:250px}
.B .plot .grid line{stroke:#1f1f1f;stroke-dasharray:1 5}
.B .plot .curve{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 4;stroke-linecap:round}
.B .plot .fill{fill:#ffffff10}
.B .plot .pt rect{fill:#ff6a1a}.B .plot .pt text{fill:#ff6a1a;font:800 12px Doto;text-anchor:middle}
.B .plot .ghost{display:none}
.B .meters{position:absolute;left:26px;right:26px;bottom:24px;height:92px;display:grid;grid-template-columns:repeat(9,1fr);gap:10px;align-items:end}
.B .m{display:flex;flex-direction:column-reverse;gap:3px;align-items:center}
.B .m i{width:100%;height:5px;background:#222}.B .m i.on{background:#3a8bff}.B .m i.on.neg{background:#ff6a1a}
.B .m span{font:800 11px Doto;color:#6a6a6a;margin-top:4px}
.B .bottom{grid-column:1/4;display:grid;grid-template-columns:repeat(3,1fr) 1.4fr;gap:14px}
.B .lightkey{border-radius:12px;background:#ecebe7;box-shadow:0 3px 0 #a9a69e;display:flex;align-items:center;gap:12px;padding:0 16px;font:500 11px Martian;color:#3a3936;cursor:pointer}
.B .lightkey.sel{transform:translateY(3px);box-shadow:none;outline:2px solid #ff6a1a;outline-offset:2px}
.B .lightkey .dot{width:22px;height:22px;border-radius:50%;background:#2b2b2b;box-shadow:inset 0 2px 3px #000}
.B .lightkey .dot.white{background:#fff;box-shadow:0 0 12px #fff}.B .lightkey .dot.blue{background:#3a8bff;box-shadow:0 0 12px #3a8bff}
.B .lightkey em{font-style:normal;display:block;color:#8a877f;font-size:9.5px}
.B .knobs{display:flex;gap:14px;align-items:center;justify-content:flex-end}
.B .enc{width:56px;height:56px;border-radius:50%;box-shadow:0 3px 0 #0003,inset 0 -3px 0 #0002;position:relative}
.B .enc::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:12px;background:#0006;transform:translateX(-50%)}

/* ── C · Measurement sheet ──────────────────────────────────────────── */
.C{background:#efebe1;color:#1d1d1b;font-family:Plex;padding:28px 30px;box-shadow:0 30px 80px #0009;display:grid;
  grid-template:"plot list" 1fr "title list" 168px / 1fr 300px;gap:0 26px;
  background-image:linear-gradient(#1d1d1b0a 1px,transparent 1px),linear-gradient(90deg,#1d1d1b0a 1px,transparent 1px);background-size:12px 12px}
.C .plotwrap{grid-area:plot;position:relative;border:1.5px solid #1d1d1b;background:#f5f2ea}
.C .plotwrap .grid line{stroke:#1d1d1b22}.C .plotwrap .grid line.major{stroke:#1d1d1b55}
.C .plotwrap .grid text{fill:#1d1d1b;font:10px Plex}
.C .plotwrap .fill{fill:#1d1d1b07}.C .plotwrap .curve{fill:none;stroke:#1d1d1b;stroke-width:1.8}
.C .plotwrap .ghost{fill:none;stroke:#d2402a;stroke-width:1.2;stroke-dasharray:6 4}
.C .plotwrap .pt circle{fill:#f5f2ea;stroke:#1d1d1b;stroke-width:1.5}.C .plotwrap .pt text{fill:#d2402a;font:500 10px Plex;text-anchor:start}
.C .plotwrap .pt line{stroke:#d2402a;stroke-width:1}
.C .heading{position:absolute;left:18px;top:14px}
.C .heading h1{font:italic 400 38px Serif;letter-spacing:-.01em;line-height:1}
.C .heading p{font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.C .list{grid-area:list;display:flex;flex-direction:column;gap:18px}
.C .list h2{font:500 10px Plex;letter-spacing:.14em;text-transform:uppercase;border-bottom:1.5px solid #1d1d1b;padding-bottom:5px;display:flex;justify-content:space-between}
.C table{width:100%;border-collapse:collapse;font-size:11.5px}
.C td{padding:6px 4px;border-bottom:1px solid #1d1d1b33;cursor:pointer}
.C td:first-child{width:28px;color:#8b867a}.C td:last-child{text-align:right;color:#8b867a;font-size:10px}
.C tr.sel td{background:#1d1d1b;color:#efebe1}.C tr.sel td:first-child,.C tr.sel td:last-child{color:#efebe1aa}
.C tr:hover:not(.sel) td{background:#1d1d1b10}
.C .name-i{font:italic 15px Serif}
.C .title{grid-area:title;margin-top:18px;border:1.5px solid #1d1d1b;display:grid;grid-template-columns:1.2fr repeat(3,1fr);font-size:10px}
.C .title > div{border-left:1px solid #1d1d1b;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.C .title > div:first-child{border-left:0}
.C .title .k{letter-spacing:.12em;text-transform:uppercase;color:#6d695f;font-size:9px}
.C .title .v{font:italic 22px Serif}
.C .stamp{cursor:pointer;position:relative}
.C .stamp .ring{width:44px;height:44px;border-radius:50%;border:2px solid #2a4bd2;display:grid;place-items:center;color:#2a4bd2;font:500 10px Plex;transform:rotate(-8deg);margin-top:2px}
.C .stamp.sel{background:#2a4bd210}
.C .stamp .stale{color:#d2402a;font-weight:500}
.C .actions{display:flex;gap:8px;margin-top:auto}
.C .actions button{font:500 10px Plex;letter-spacing:.1em;text-transform:uppercase;background:none;border:1.5px solid #1d1d1b;padding:8px 10px;cursor:pointer}
.C .actions button.primary{background:#1d1d1b;color:#efebe1}
</style>
</head>
<body>
<div class="picker">
  <b>Sound Lab · direction</b>
  <button data-d="A" aria-pressed="true">A · Bench instrument</button>
  <button data-d="B" aria-pressed="false">B · Field display</button>
  <button data-d="C" aria-pressed="false">C · Measurement sheet</button>
  <span class="note">Board only · band frequencies and gain range are provisional until the speaker is probed</span>
</div>
<div class="stage">
  <section class="dir A on" data-dir="A"></section>
  <section class="dir B" data-dir="B"></section>
  <section class="dir C" data-dir="C"></section>
</div>
<script>
// ---- Shared model (illustrative data) ---------------------------------------------------
const FREQS=[80,151,286,540,1020,1930,3650,6900,13000];   // provisional: 9 log-spaced bands, 80 Hz–13 kHz
const RANGE=8;                                               // provisional ±dB
const hz=f=>f>=1000?(f/1000).toFixed(f%1000?1:0)+'k':String(f);
// Factory shapes traced from the Tribit app (relative, not band data).
const TRACE={
 0:[472,565,643,704,746,748,713,652,583,535,513,498,491,487,480,474,467,463,461,470,502,548,583,593,589,576,565,559,561,578,604,639,678],
 1:[465,546,611,663,698,700,676,628,574,535,511,493,483,476,470,465,461,461,461,463,480,504,522,526,524,517,511,509,509,517,533,548,567],
 3:[411,450,485,522,559,604,654,691,704,704,704,704,704,704,704,704,704,704,704,704,702,689,648,598,557,524,489,467,459,459,459,459,459],
 4:[580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,593,626,663,691,709,720,726,728,728,728,728,728],
 2:[461,461,461,461,461,467,528,626,715,752,752,752,752,752,752,752,752,752,752,746,715,663,613,578,548,524,504,489,476,470,465,463,461],
 5:[726,672,628,596,580,604,657,709,728,728,728,728,728,707,654,602,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580,580]};
const FACTORY=[[0,'XBass Off','flat low end'],[1,'XBass','bass lift'],[3,'MaxSound','traditional'],[4,'Rock','bright top'],[2,'Audiobook','voice band'],[5,'Jazz','warm low mid']]
  .map(([id,name,hint])=>({key:'f'+id,id,name,hint,factory:true}));
const S={
  profiles:[{key:'p1',name:'Night Desk',bands:[3,2,1,0,-1,0,1,1,0],rev:4},{key:'p2',name:'Vocal Lift',bands:[-2,-1,0,1,3,3,2,0,-1],rev:2},{key:'p3',name:'Garden',bands:[4,3,1,0,0,1,2,3,2],rev:1}],
  sel:'f1', active:'f1', slot:null,
  buttons:[{src:'f0',sync:'ok'},{src:'p1',sync:'stale'},{src:'f2',sync:'ok'}],
};
const all=()=>[...FACTORY,...S.profiles];
const find=k=>all().find(p=>p.key===k);
// One response curve, sampled at N points across log frequency, in dB.
const N=160,LO=Math.log(60),HI=Math.log(16000);
function sample(p){
  if(p.factory){const t=TRACE[p.id];return Array.from({length:N},(_,i)=>{const x=i/(N-1)*(t.length-1),j=Math.min(Math.floor(x),t.length-2),u=x-j;return((t[j]*(1-u)+t[j+1]*u)-585)/38;});}
  const xs=FREQS.map(f=>(Math.log(f)-LO)/(HI-LO)),b=p.bands;
  return Array.from({length:N},(_,i)=>{const x=i/(N-1);let k=xs.findIndex(v=>v>x);if(k<0)return b[8];if(k===0)return b[0];k--;
    const u=(x-xs[k])/(xs[k+1]-xs[k]),p0=b[Math.max(k-1,0)],p1=b[k],p2=b[k+1],p3=b[Math.min(k+2,8)];
    return .5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u*u+(-p0+3*p1-3*p2+p3)*u*u*u);});
}
// ---- Curve renderer shared by every direction -------------------------------------------
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
class Plot{
  constructor(svg,{w,h,pad=[34,18,26,40],range=RANGE+2,grid}){Object.assign(this,{svg,w,h,pad,range});this.cur=null;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('width',w);svg.setAttribute('height',h);
    svg.insertAdjacentHTML('beforeend',`<g class="grid"></g><path class="fill"/><path class="ghost"/><path class="curve"/><g class="pts"></g>`);
    (grid||this.defaultGrid).call(this,svg.querySelector('.grid'));}
  X(x){const[l,,r]=[this.pad[3],0,this.pad[1]];return l+x*(this.w-l-r)}
  Y(db){const t=this.pad[0],b=this.pad[2];return t+(1-(db+this.range)/(2*this.range))*(this.h-t-b)}
  fx(f){return this.X((Math.log(f)-LO)/(HI-LO))}
  defaultGrid(g){let s='';for(const f of [100,200,500,1000,2000,5000,10000])s+=`<line x1="${this.fx(f)}" x2="${this.fx(f)}" y1="${this.pad[0]}" y2="${this.h-this.pad[2]}"/><text x="${this.fx(f)+4}" y="${this.h-this.pad[2]+14}">${hz(f)}</text>`;
    for(let d=-this.range+2;d<=this.range-2;d+=3)s+=`<line x1="${this.pad[3]}" x2="${this.w-this.pad[1]}" y1="${this.Y(d)}" y2="${this.Y(d)}"/><text x="6" y="${this.Y(d)+3}">${d>0?'+':''}${d}</text>`;g.innerHTML=s;}
  path(v){return v.map((d,i)=>(i?'L':'M')+this.X(i/(N-1)).toFixed(1)+' '+this.Y(d).toFixed(1)).join('')}
  draw(v){this.svg.querySelector('.curve').setAttribute('d',this.path(v));
    this.svg.querySelector('.fill').setAttribute('d',this.path(v)+`L${this.X(1)} ${this.h-this.pad[2]}L${this.X(0)} ${this.h-this.pad[2]}Z`);}
  show(target,ghost){const from=this.cur||target.map(()=>0);this.cur=target;
    this.svg.querySelector('.ghost').setAttribute('d',ghost?this.path(ghost):'');
    if(reduce){this.draw(target);return;}
    const t0=performance.now(),run=t=>{const k=Math.min(1,(t-t0)/420),e=1-Math.pow(1-k,3);this.draw(from.map((a,i)=>a+(target[i]-a)*e));if(k<1)requestAnimationFrame(run);};
    requestAnimationFrame(run);}
  points(p,label){const g=this.svg.querySelector('.pts');g.innerHTML='';if(p.factory)return;
    p.bands.forEach((b,i)=>{const x=this.fx(FREQS[i]),y=this.Y(b);
      g.insertAdjacentHTML('beforeend',`<g class="pt" data-i="${i}" tabindex="0" role="slider" aria-label="${hz(FREQS[i])} Hz" aria-valuemin="${-RANGE}" aria-valuemax="${RANGE}" aria-valuenow="${b}">${label(x,y,b,i)}</g>`);});
    g.querySelectorAll('.pt').forEach(el=>{const i=+el.dataset.i;
      el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);el.classList.add('drag');
        const box=this.svg.getBoundingClientRect(),sy=this.h/box.height;
        el.onpointermove=m=>{const y=(m.clientY-box.top)*sy,db=Math.round(this.range-(y-this.pad[0])/(this.h-this.pad[0]-this.pad[2])*2*this.range);
          const v=Math.max(-RANGE,Math.min(RANGE,db));if(v!==p.bands[i]){p.bands[i]=v;edited(p);}};
        el.onpointerup=()=>{el.classList.remove('drag');el.onpointermove=null;};};
      el.onkeydown=e=>{const d={ArrowUp:1,ArrowDown:-1}[e.key];if(!d)return;e.preventDefault();p.bands[i]=Math.max(-RANGE,Math.min(RANGE,p.bands[i]+d));edited(p);};});}
}
function edited(p){p.rev++;S.buttons.forEach(b=>{if(b.src===p.key)b.sync='stale';});const v=sample(p);plots.forEach(pl=>{pl.cur=v;pl.draw(v);});render(false);}
// ---- Direction A ------------------------------------------------------------------------
const A=document.querySelector('.A');
A.innerHTML=`
 <div class="head"><span class="name">XSOUND PLUS 2</span><span><span class="led"></span>LINKED · RFCOMM 3</span>
  <span><span class="batt"><i></i><i></i><i></i><i></i><i class="off"></i></span>90%</span><span class="act"></span>
  <span class="win"><span>device</span><span>—</span><span>□</span><span>×</span></span></div>
 <div class="keys"><div class="lbl">factory</div><div class="pad"></div><div class="lbl">library</div><div class="custom"></div></div>
 <div class="disp"><div class="title">editing<b></b></div><div class="state"></div>
  <svg><defs><linearGradient id="aFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ad6c1" stop-opacity=".28"/><stop offset="1" stop-color="#3ad6c1" stop-opacity="0"/></linearGradient>
  <filter id="aGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs></svg></div>
 <div class="bands"></div>
 <div class="patch"><div class="lbl">eq button</div><div class="slots"></div>
  <div class="press">Press the speaker's EQ button:<br><b>off → white → blue</b> cycles these three.</div>
  <button class="apply">APPLY TO SPEAKER</button></div>`;
const plotA=new Plot(A.querySelector('svg'),{w:668,h:540,pad:[44,18,28,40]});
function renderA(){
  A.querySelector('.pad').innerHTML=FACTORY.map(p=>`<button class="key ${S.sel===p.key?'sel':''}" data-k="${p.key}">${p.name}<small>${p.hint}</small></button>`).join('');
  A.querySelector('.custom').innerHTML=S.profiles.map(p=>`<div class="row ${S.sel===p.key?'sel':''}" data-k="${p.key}">${p.name}<span class="tag">r${p.rev}</span></div>`).join('')+`<div class="row"><span class="new">+ new from current</span></div>`;
  const p=find(S.sel);A.querySelector('.disp b').textContent=p.name;
  A.querySelector('.state').textContent=p.factory?'factory · read only · duplicate to edit':'local · unsaved changes apply on demand';
  A.querySelector('.act').textContent='ACTIVE · '+find(S.active).name.toUpperCase();
  A.querySelector('.bands').innerHTML=FREQS.map((f,i)=>{const v=p.factory?null:p.bands[i];return`<div class="band"><div class="db">${v===null?'—':(v>0?'+':'')+v}</div>
    <div class="knob" style="--a:${v===null?0:(v+RANGE)/(2*RANGE)*270}deg"></div><div class="hz">${hz(f)}</div></div>`}).join('');
  A.querySelector('.slots').innerHTML=S.buttons.map((b,i)=>`<div class="slot ${S.slot===i?'sel':''}" data-s="${i}"><div class="lamp ${['','white','blue'][i]}"></div>
    <div class="sn">${['light off','white','blue'][i]}</div><div class="pn">${find(b.src).name}</div><div class="sync ${b.sync}">${b.sync==='ok'?'● on speaker':'◐ edited since sync'}</div></div>`).join('');
  plotA.points(p,(x,y,b)=>`<circle cx="${x}" cy="${y}" r="6"/><text x="${x}" y="${y-12}">${b>0?'+':''}${b} dB</text>`);
}
// ---- Direction B ------------------------------------------------------------------------
const B=document.querySelector('.B');
B.innerHTML=`<div class="side l"></div>
 <div class="screen"><div class="top"><span>XSOUND+2</span><span class="dim">LINK ●  BAT 90</span></div>
  <div class="big"></div><svg class="plot"></svg><div class="meters"></div></div>
 <div class="side r"></div>
 <div class="bottom"></div>`;
const plotB=new Plot(B.querySelector('svg'),{w:848,h:250,pad:[10,6,10,6],grid(g){let s='';for(let i=0;i<=8;i++)s+=`<line x1="${this.fx(FREQS[i])}" x2="${this.fx(FREQS[i])}" y1="0" y2="250"/>`;
  s+=`<line x1="0" x2="848" y1="${this.Y(0)}" y2="${this.Y(0)}"/>`;g.innerHTML=s;}});
function renderB(){
  const keys=[...FACTORY,...S.profiles];
  const soft=(p,c)=>`<button class="soft ${S.sel===p.key?'sel':''}" data-k="${p.key}"><span><span class="c" style="background:${c}"></span>${p.name.toLowerCase().replace(' traditional','')}</span></button>`;
  const cols=['#3a8bff','#3ec46d','#f2f2f2','#ff6a1a'];
  B.querySelector('.side.l').innerHTML=keys.slice(0,4).map((p,i)=>soft(p,cols[i])).join('');
  B.querySelector('.side.r').innerHTML=keys.slice(4,8).map((p,i)=>soft(p,cols[i])).join('');
  const p=find(S.sel);B.querySelector('.big').innerHTML=p.name.toUpperCase()+`<small>${p.factory?'FACTORY':'R'+p.rev}</small>`;
  B.querySelector('.meters').innerHTML=FREQS.map((f,i)=>{const v=p.factory?0:p.bands[i];let s='';for(let k=1;k<=8;k++)s+=`<i class="${Math.abs(v)>=k?'on':''} ${v<0?'neg':''}"></i>`;return`<div class="m"><span>${hz(f)}</span>${s}</div>`}).join('');
  B.querySelector('.bottom').innerHTML=S.buttons.map((b,i)=>`<div class="lightkey ${S.slot===i?'sel':''}" data-s="${i}"><span class="dot ${['','white','blue'][i]}"></span>
    <span>${['off','white','blue'][i]}<em>${find(b.src).name.toLowerCase()}${b.sync==='stale'?' · resync':''}</em></span></div>`).join('')+
    `<div class="knobs"><span class="enc" style="background:#3a8bff"></span><span class="enc" style="background:#3ec46d"></span><span class="enc" style="background:#f2f2f2"></span><span class="enc" style="background:#ff6a1a"></span></div>`;
  plotB.points(p,(x,y,b)=>`<rect x="${x-5}" y="${y-5}" width="10" height="10"/><text x="${x}" y="${y-12}">${b>0?'+':''}${b}</text>`);
}
// ---- Direction C ------------------------------------------------------------------------
const C=document.querySelector('.C');
C.innerHTML=`<div class="plotwrap"><div class="heading"><h1></h1><p></p></div><svg></svg></div>
 <div class="list"><div><h2><span>Factory</span><span>speaker · fixed</span></h2><table class="fac"></table></div>
  <div><h2><span>Library</span><span>this pc</span></h2><table class="lib"></table></div>
  <div class="actions"><button>Duplicate</button><button>Save</button><button class="primary">Apply</button></div></div>
 <div class="title"><div><span class="k">Instrument</span><span class="v">XSound Plus 2</span><span class="k">linked · 90 % · fw 0.3.1</span></div></div>`;
const plotC=new Plot(C.querySelector('svg'),{w:790,h:494,pad:[96,22,34,46],grid(g){let s='';
  for(const f of [60,70,80,90,100,200,300,400,500,600,700,800,900,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000,16000]){const m=[100,1000,10000].includes(f);
    s+=`<line class="${m?'major':''}" x1="${this.fx(f)}" x2="${this.fx(f)}" y1="${this.pad[0]}" y2="${this.h-this.pad[2]}"/>`;if([100,200,500,1000,2000,5000,10000].includes(f))s+=`<text x="${this.fx(f)-8}" y="${this.h-12}">${hz(f)}</text>`;}
  for(let d=-this.range;d<=this.range;d++)s+=`<line class="${d%5===0?'major':''}" x1="${this.pad[3]}" x2="${this.w-this.pad[1]}" y1="${this.Y(d)}" y2="${this.Y(d)}"/>`+(d%5===0?`<text x="8" y="${this.Y(d)+3}">${d>0?'+':''}${d} dB</text>`:'');
  g.innerHTML=s;}});
function renderC(){
  const row=(p,i)=>`<tr class="${S.sel===p.key?'sel':''}" data-k="${p.key}"><td>${String(i+1).padStart(2,'0')}</td><td class="${p.factory?'':'name-i'}">${p.name}</td><td>${p.factory?'fixed':'rev '+p.rev}</td></tr>`;
  C.querySelector('.fac').innerHTML=FACTORY.map(row).join('');C.querySelector('.lib').innerHTML=S.profiles.map((p,i)=>row(p,i+6)).join('');
  const p=find(S.sel);C.querySelector('h1').textContent=p.name;
  C.querySelector('.heading p').textContent=p.factory?'factory response · shape as drawn by Tribit':`custom · 9 bands · rev ${p.rev}`;
  const t=C.querySelector('.title');t.querySelectorAll('.stamp').forEach(e=>e.remove());
  t.insertAdjacentHTML('beforeend',S.buttons.map((b,i)=>`<div class="stamp ${S.slot===i?'sel':''}" data-s="${i}"><span class="k">EQ button · ${['off','white','blue'][i]}</span>
    <span class="v" style="font-size:17px">${find(b.src).name}</span><span class="ring">${['OFF','WHT','BLU'][i]}</span>${b.sync==='stale'?'<span class="stale">rev changed · resync</span>':''}</div>`).join(''));
  plotC.points(p,(x,y,b)=>`<line x1="${x}" x2="${x}" y1="${plotC.Y(0)}" y2="${y}"/><circle cx="${x}" cy="${y}" r="4.5"/><text x="${x+7}" y="${y-6}">${b>0?'+':''}${b}</text>`);
}
// ---- Wiring -----------------------------------------------------------------------------
const plots=[plotA,plotB,plotC];
function render(animate=true){renderA();renderB();renderC();
  const p=find(S.sel),v=sample(p),ghost=S.slot!==null||p.factory?null:sample(find(S.active));
  if(animate)plots.forEach(pl=>pl.show(v,ghost));}
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]'),s=e.target.closest('[data-s]'),d=e.target.closest('[data-d]');
  if(d){document.querySelectorAll('.picker button').forEach(b=>b.setAttribute('aria-pressed',b===d));document.querySelectorAll('.dir').forEach(x=>x.classList.toggle('on',x.dataset.dir===d.dataset.d));return;}
  if(k){S.sel=k.dataset.k;S.slot=null;render();}
  else if(s){S.slot=+s.dataset.s;S.sel=S.buttons[S.slot].src;render();}
  else if(e.target.closest('.apply,.primary')){S.active=S.sel;S.buttons.forEach(b=>{if(b.src===S.sel)b.sync='ok';});render(false);}
});
render();
if(/^#[ABC]$/.test(location.hash))document.querySelector(`[data-d=${location.hash[1]}]`).click();
</script>
</body>
